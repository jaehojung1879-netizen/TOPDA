<html lang="ko">
<head>
<meta charset="utf-8" />

<link rel="icon" href="https://topda.kr/assets/images/brand/logo.png" type="image/png" />
<link rel="canonical" href="https://topda.kr/board-write.html" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<link rel="stylesheet" href="assets/styles.css?v=20260728" />
</head>
<body>

<header class="site-header">
  <div class="container row">
    <a href="index.html" class="brand"><span class="brand-mark"></span>톺다</a>
    <nav class="nav">
      <a href="guides.html">가이드</a>
      <a href="calculators/index.html">계산기</a>
      <a href="market.html">시세정보</a>
      <a href="checklists/index.html">체크리스트</a>
    </nav>
    <button class="nav-toggle" data-nav-toggle aria-label="메뉴 열기">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
  </div>
  <div class="mobile-menu" data-mobile-menu>
    <a href="guides.html">가이드</a><a href="calculators/index.html">계산기</a><a href="market.html">시세정보</a><a href="checklists/index.html">체크리스트</a><a href="board.html">게시판</a>
  </div>
</header>

<main class="container-narrow board-editor-page">
  <div class="breadcrumb"><a href="index.html">홈</a> / <a href="board.html">게시판</a> / 글쓰기</div>
  <header class="board-editor-head">
    <h1>게시글 작성</h1>
    <p>질문이나 경험을 이해하기 쉽게 적어주세요. 작성 중인 내용은 이 브라우저에 자동 저장됩니다.</p>
  </header>

  <p class="fb-status" data-board-write-status hidden></p>

  <form class="board-editor" data-board-write>
    <div class="field">
      <label for="board-category">카테고리</label>
      <select id="board-category" name="category" required></select>
    </div>
    <div class="field">
      <label for="board-title">제목</label>
      <input id="board-title" name="title" type="text" maxlength="80" required placeholder="예: 첫 전세 계약 전에 확인할 점이 궁금해요" />
    </div>
    <div class="field">
      <label for="board-author">닉네임 <span class="label-optional">선택</span></label>
      <input id="board-author" name="author" type="text" maxlength="20" autocomplete="nickname" placeholder="입력하지 않으면 익명으로 표시됩니다" />
    </div>
    <div class="field">
      <label for="board-page">관련 페이지 또는 링크 <span class="label-optional">선택</span></label>
      <input id="board-page" name="page" type="text" maxlength="120" placeholder="예: /calculators/acquisition-tax.html" />
    </div>
    <div class="field board-body-field">
      <div class="field-label-row">
        <label for="board-body">내용</label>
        <span data-body-count>0 / 2,000</span>
      </div>
      <textarea id="board-body" name="body" rows="14" maxlength="2000" required placeholder="나누고 싶은 경험이나 질문을 자유롭게 적어주세요."></textarea>
    </div>
    <label class="board-secret-option">
      <input type="checkbox" name="secret" />
      <span><strong>비밀글로 작성</strong><small>작성한 브라우저와 운영자만 내용을 볼 수 있습니다.</small></span>
    </label>
    <div class="board-editor-actions">
      <a class="btn btn-secondary" href="board.html">취소</a>
      <button class="btn btn-primary" type="submit">게시</button>
    </div>
  </form>
</main>

<footer class="site-footer">
  <div class="container"><p class="disclaimer">© 톺다. 개인정보·민감정보는 게시글에 입력하지 마세요.</p></div>
</footer>

<script src="assets/app.js?v=20260723"></script>
<script src="assets/supabase-client.js?v=20260728"></script>
<script src="assets/board.js?v=20260728"></script>
</body>
</html>
