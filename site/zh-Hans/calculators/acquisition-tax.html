    <div class="breadcrumb"><a href="../index.html">首页</a> / <a href="index.html">计算器</a> / 取得税</div>
    <h1>取得税计算器</h1>
    <div class="meta"><span>住宅 · 标准税率 · 外国人适用同样税率</span></div>
  </div>
  <div class="calc-layout" data-calc="acquisition-tax">
    <div class="calc-form">
      <div class="field"><label for="price">取得价（成交价，KRW）</label>
        <div class="input-suffix" data-suffix="KRW"><input id="price" name="price" type="text" inputmode="numeric" data-format="won" value="800,000,000" /></div>
        <span class="hint">实际合同价。</span>
      </div>
      <div class="field"><label>房屋套数（含本次）</label>
        <div class="radio-group">
          <label><input type="radio" name="homes" value="1" checked/><span>1套</span></label>
          <label><input type="radio" name="homes" value="2"/><span>2套</span></label>
          <label><input type="radio" name="homes" value="3"/><span>3套</span></label>
          <label><input type="radio" name="homes" value="4"/><span>4套以上</span></label>
        </div>
        <span class="hint">按家庭为单位持有的套数。</span>
      </div>
      <div class="field"><label class="check-item" style="padding:0; cursor:pointer;">
        <input type="checkbox" name="regulated"/><span class="text">位于调整对象地区（조정대상지역）<span class="note">自第2套起适用重课税率。</span></span>
      </label></div>
      <div class="field"><label class="check-item" style="padding:0; cursor:pointer;">
        <input type="checkbox" name="areaOver85"/><span class="text">专用面积 > 85㎡<span class="note">触发 0.2% 农渔村特别税。</span></span>
      </label></div>
    </div>
    <div class="calc-result">
      <h3>预计合计</h3>
      <div class="result-scenario" data-out="scenario">请输入价格</div>
      <div class="total" data-out="total">KRW 0</div>
      <div class="breakdown">
        <div class="row"><span class="key">适用税率</span><span class="val" data-out="rate">—</span></div>
        <div class="row sub"><span class="key">取得税</span><span class="val" data-out="acquisition">KRW 0</span></div>
        <div class="row sub"><span class="key">农渔村特别税</span><span class="val" data-out="ruralTax">KRW 0</span></div>
        <div class="row sub"><span class="key">地方教育税</span><span class="val" data-out="localEduTax">KRW 0</span></div>
      </div>
      <div class="callout callout-info" style="margin-top:24px; margin-bottom:0;"><div class="icon">i</div><div class="body">仅按标准税率。未含生涯首套减免、预售权等情形。非标准情形请咨询税务师。</div></div>
    </div>
  </div>
