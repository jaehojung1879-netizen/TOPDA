    <h1>中介手续费计算器</h1>
    <div class="meta"><span>首尔上限费率 · 实际可协商 · 另加增值税</span></div>
  </div>
  <div class="calc-layout" data-calc="brokerage-fee">
    <div class="calc-form">
      <div class="field"><label>交易类型</label>
        <div class="radio-group">
          <label><input type="radio" name="type" value="sale" checked/><span>买卖 (매매)</span></label>
          <label><input type="radio" name="type" value="jeonse"/><span>全租 (전세)</span></label>
        </div>
      </div>
      <div class="field"><label for="price">交易金额（KRW）</label>
        <div class="input-suffix" data-suffix="KRW"><input id="price" name="price" type="text" inputmode="numeric" data-format="won" value="500,000,000" /></div>
        <span class="hint">买卖填成交价；全租填押金。</span>
      </div>
    </div>
    <div class="calc-result">
      <h3>最高合计（含增值税）</h3>
      <div class="total" data-out="total">KRW 0</div>
      <div class="breakdown">
        <div class="row"><span class="key">费率</span><span class="val" data-out="rate">—</span></div>
        <div class="row"><span class="key">上限</span><span class="val" data-out="cap">—</span></div>
        <div class="row sub"><span class="key">佣金（不含税）</span><span class="val" data-out="fee">KRW 0</span></div>
        <div class="row sub"><span class="key">增值税（10%）</span><span class="val" data-out="vat">KRW 0</span></div>
      </div>
      <div class="callout callout-info" style="margin-top:24px; margin-bottom:0;"><div class="icon">i</div><div class="body">这是上限而非固定费率，实际可协商。仅当中介为一般纳税人时收取增值税。</div></div>
    </div>
  </div>
