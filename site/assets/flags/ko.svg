<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 20" role="img" aria-label="한국어">
  <rect width="30" height="20" fill="#fff"/>

  <!-- 태극 문양 -->
  <g transform="translate(15 10)">
    <circle r="5.6" fill="#c60c30"/>
    <path d="M-5.6,0 A2.8,2.8 0 0,1 0,0 A2.8,2.8 0 0,0 5.6,0 A5.6,5.6 0 0,1 -5.6,0 Z" fill="#003478"/>
  </g>

  <!-- 극소 크기(20x15px 등) 다운스케일 시 얇은 선이 사라져 얼룩처럼 보이는 문제를 막기 위해
       괘 선 두께를 굵게(1.9)하고 끊긴 괘의 여백도 넉넉히 키움(아이콘 최적화 버전) -->

  <!-- 건(乾) — 좌상단, 세 줄 모두 실선 -->
  <g transform="translate(6.4 5.2) rotate(-45)" stroke="#000" stroke-width="1.9" stroke-linecap="butt">
    <line x1="-2.9" y1="-2.1" x2="2.9" y2="-2.1"/>
    <line x1="-2.9" y1="0"    x2="2.9" y2="0"/>
    <line x1="-2.9" y1="2.1"  x2="2.9" y2="2.1"/>
  </g>

  <!-- 감(坎) — 우상단, 가운데만 실선(물) -->
  <g transform="translate(23.6 5.2) rotate(45)" stroke="#000" stroke-width="1.9" stroke-linecap="butt">
    <line x1="-2.9" y1="-2.1" x2="-0.6" y2="-2.1"/><line x1="0.6" y1="-2.1" x2="2.9" y2="-2.1"/>
    <line x1="-2.9" y1="0"    x2="2.9"  y2="0"/>
    <line x1="-2.9" y1="2.1"  x2="-0.6" y2="2.1"/><line x1="0.6" y1="2.1" x2="2.9" y2="2.1"/>
  </g>

  <!-- 리(離) — 좌하단, 가운데만 끊김(불) -->
  <g transform="translate(6.4 14.8) rotate(45)" stroke="#000" stroke-width="1.9" stroke-linecap="butt">
    <line x1="-2.9" y1="-2.1" x2="2.9"  y2="-2.1"/>
    <line x1="-2.9" y1="0"    x2="-0.6" y2="0"/><line x1="0.6" y1="0" x2="2.9" y2="0"/>
    <line x1="-2.9" y1="2.1"  x2="2.9"  y2="2.1"/>
  </g>

  <!-- 곤(坤) — 우하단, 세 줄 모두 끊김 -->
  <g transform="translate(23.6 14.8) rotate(-45)" stroke="#000" stroke-width="1.9" stroke-linecap="butt">
    <line x1="-2.9" y1="-2.1" x2="-0.6" y2="-2.1"/><line x1="0.6" y1="-2.1" x2="2.9" y2="-2.1"/>
    <line x1="-2.9" y1="0"    x2="-0.6" y2="0"/><line x1="0.6" y1="0" x2="2.9" y2="0"/>
    <line x1="-2.9" y1="2.1"  x2="-0.6" y2="2.1"/><line x1="0.6" y1="2.1" x2="2.9" y2="2.1"/>
  </g>
</svg>
