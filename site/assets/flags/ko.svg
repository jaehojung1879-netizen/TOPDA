<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 20" role="img" aria-label="한국어">
  <rect width="30" height="20" fill="#fff"/>

  <!-- 태극 문양 -->
  <g transform="translate(15 10)">
    <circle r="5" fill="#c60c30"/>
    <path d="M-5,0 A2.5,2.5 0 0,1 0,0 A2.5,2.5 0 0,0 5,0 A5,5 0 0,1 -5,0 Z" fill="#003478"/>
  </g>

  <!-- 건(乾) — 좌상단, 세 줄 모두 실선 -->
  <g transform="translate(6.6 5.4) rotate(-45)" stroke="#000" stroke-width="0.55" stroke-linecap="square">
    <line x1="-2.6" y1="-1.6" x2="2.6" y2="-1.6"/>
    <line x1="-2.6" y1="0"    x2="2.6" y2="0"/>
    <line x1="-2.6" y1="1.6"  x2="2.6" y2="1.6"/>
  </g>

  <!-- 감(坎) — 우상단, 가운데만 실선(물) -->
  <g transform="translate(23.4 5.4) rotate(45)" stroke="#000" stroke-width="0.55" stroke-linecap="square">
    <line x1="-2.6" y1="-1.6" x2="-0.5" y2="-1.6"/><line x1="0.5" y1="-1.6" x2="2.6" y2="-1.6"/>
    <line x1="-2.6" y1="0"    x2="2.6"  y2="0"/>
    <line x1="-2.6" y1="1.6"  x2="-0.5" y2="1.6"/><line x1="0.5" y1="1.6" x2="2.6" y2="1.6"/>
  </g>

  <!-- 리(離) — 좌하단, 가운데만 끊김(불) -->
  <g transform="translate(6.6 14.6) rotate(45)" stroke="#000" stroke-width="0.55" stroke-linecap="square">
    <line x1="-2.6" y1="-1.6" x2="2.6"  y2="-1.6"/>
    <line x1="-2.6" y1="0"    x2="-0.5" y2="0"/><line x1="0.5" y1="0" x2="2.6" y2="0"/>
    <line x1="-2.6" y1="1.6"  x2="2.6"  y2="1.6"/>
  </g>

  <!-- 곤(坤) — 우하단, 세 줄 모두 끊김 -->
  <g transform="translate(23.4 14.6) rotate(-45)" stroke="#000" stroke-width="0.55" stroke-linecap="square">
    <line x1="-2.6" y1="-1.6" x2="-0.5" y2="-1.6"/><line x1="0.5" y1="-1.6" x2="2.6" y2="-1.6"/>
    <line x1="-2.6" y1="0"    x2="-0.5" y2="0"/><line x1="0.5" y1="0" x2="2.6" y2="0"/>
    <line x1="-2.6" y1="1.6"  x2="-0.5" y2="1.6"/><line x1="0.5" y1="1.6" x2="2.6" y2="1.6"/>
  </g>
</svg>
