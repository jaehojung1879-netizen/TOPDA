<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 20" role="img" aria-label="한국어">
  <rect width="30" height="20" fill="#fff"/>

  <!-- 태극 문양 -->
  <g transform="translate(15 10)">
    <circle r="5.6" fill="#c60c30"/>
    <path d="M5.6,0 A2.8,2.8 0 0,0 0,0 A2.8,2.8 0 0,1 -5.6,0 A5.6,5.6 0 0,0 5.6,0 Z" fill="#003478"/>
  </g>

  <!-- 4괘: 얇은 선(1.0) + 줄 간격을 넉넉히(±2.5) 두어 3줄이 뭉치지 않고 또렷이 분리되도록 함 -->

  <!-- 건(乾) — 좌상단, 세 줄 모두 실선 -->
  <g transform="translate(6.4 5.2) rotate(-45)" stroke="#000" stroke-width="1" stroke-linecap="butt">
    <line x1="-2.7" y1="-2.5" x2="2.7" y2="-2.5"/>
    <line x1="-2.7" y1="0"    x2="2.7" y2="0"/>
    <line x1="-2.7" y1="2.5"  x2="2.7" y2="2.5"/>
  </g>

  <!-- 감(坎) — 우상단, 가운데만 실선(물) -->
  <g transform="translate(23.6 5.2) rotate(45)" stroke="#000" stroke-width="1" stroke-linecap="butt">
    <line x1="-2.7" y1="-2.5" x2="-0.5" y2="-2.5"/><line x1="0.5" y1="-2.5" x2="2.7" y2="-2.5"/>
    <line x1="-2.7" y1="0"    x2="2.7"  y2="0"/>
    <line x1="-2.7" y1="2.5"  x2="-0.5" y2="2.5"/><line x1="0.5" y1="2.5" x2="2.7" y2="2.5"/>
  </g>

  <!-- 리(離) — 좌하단, 가운데만 끊김(불) -->
  <g transform="translate(6.4 14.8) rotate(45)" stroke="#000" stroke-width="1" stroke-linecap="butt">
    <line x1="-2.7" y1="-2.5" x2="2.7"  y2="-2.5"/>
    <line x1="-2.7" y1="0"    x2="-0.5" y2="0"/><line x1="0.5" y1="0" x2="2.7" y2="0"/>
    <line x1="-2.7" y1="2.5"  x2="2.7"  y2="2.5"/>
  </g>

  <!-- 곤(坤) — 우하단, 세 줄 모두 끊김 -->
  <g transform="translate(23.6 14.8) rotate(-45)" stroke="#000" stroke-width="1" stroke-linecap="butt">
    <line x1="-2.7" y1="-2.5" x2="-0.5" y2="-2.5"/><line x1="0.5" y1="-2.5" x2="2.7" y2="-2.5"/>
    <line x1="-2.7" y1="0"    x2="-0.5" y2="0"/><line x1="0.5" y1="0" x2="2.7" y2="0"/>
    <line x1="-2.7" y1="2.5"  x2="-0.5" y2="2.5"/><line x1="0.5" y1="2.5" x2="2.7" y2="2.5"/>
  </g>
</svg>
