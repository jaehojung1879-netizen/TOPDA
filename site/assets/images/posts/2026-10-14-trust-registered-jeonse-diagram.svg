<svg xmlns="http://www.w3.org/2000/svg" width="900" height="980" viewBox="0 0 900 980" role="img" aria-labelledby="title desc">
  <title id="title">신탁등기 주택 계약 전 확인 흐름</title>
  <desc id="desc">등기부에서 신탁을 발견하면 신탁원부를 확인하고, 수탁자 승낙과 보증금 계좌 및 반환 책임을 대조한 뒤 보증기관에 사전 확인한다. 모든 내용이 일치하면 계약하고, 하나라도 불명확하면 계약금 지급을 멈춘다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f8f6"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#18352c" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L10 6 L0 12 Z" fill="#56756b"/></marker>
    <style>
      .k{font-family:Pretendard,"Noto Sans KR",Arial,sans-serif}.title{font-size:34px;font-weight:800;fill:#153b31}.sub{font-size:18px;fill:#4d655e}.box{fill:#fff;stroke:#b8cbc4;stroke-width:2}.n{fill:#1f6b56}.nt{font-size:18px;font-weight:800;fill:#fff;text-anchor:middle}.h{font-size:24px;font-weight:800;fill:#173e33}.p{font-size:18px;fill:#465d56}.small{font-size:16px;fill:#5b706a}.yes{fill:#e6f5ef;stroke:#62a58d;stroke-width:2}.stop{fill:#fff1ed;stroke:#d47e68;stroke-width:2}.line{stroke:#56756b;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="900" height="980" rx="28" fill="url(#bg)"/>
  <text class="k title" x="60" y="67">신탁등기 집, 계약금 전 확인 순서</text>
  <text class="k sub" x="60" y="101">설명보다 등기부·신탁원부·승낙서·계좌가 서로 맞는지 확인합니다</text>

  <g filter="url(#shadow)"><rect class="box" x="120" y="140" width="660" height="120" rx="20"/></g>
  <circle class="n" cx="170" cy="200" r="27"/><text class="k nt" x="170" y="207">1</text>
  <text class="k h" x="220" y="187">당일 등기사항증명서</text>
  <text class="k p" x="220" y="222">갑구의 수탁자·신탁 접수일·신탁원부 번호 확인</text>
  <path class="line" d="M450 260V300"/>

  <g filter="url(#shadow)"><rect class="box" x="120" y="300" width="660" height="120" rx="20"/></g>
  <circle class="n" cx="170" cy="360" r="27"/><text class="k nt" x="170" y="367">2</text>
  <text class="k h" x="220" y="347">신탁원부 전체</text>
  <text class="k p" x="220" y="382">임대 권한·사전 승낙·보증금 수령과 반환 조항 확인</text>
  <path class="line" d="M450 420V460"/>

  <g filter="url(#shadow)"><rect class="box" x="120" y="460" width="660" height="140" rx="20"/></g>
  <circle class="n" cx="170" cy="530" r="27"/><text class="k nt" x="170" y="537">3</text>
  <text class="k h" x="220" y="508">수탁자 공식 확인</text>
  <text class="k p" x="220" y="543">승낙서 진위·계약 상대·지정 계좌·반환 책임 대조</text>
  <text class="k small" x="220" y="574">중개사가 준 연락처가 아닌 공식 대표번호를 이용</text>
  <path class="line" d="M450 600V640"/>

  <g filter="url(#shadow)"><rect class="box" x="120" y="640" width="660" height="120" rx="20"/></g>
  <circle class="n" cx="170" cy="700" r="27"/><text class="k nt" x="170" y="707">4</text>
  <text class="k h" x="220" y="687">대출·반환보증 사전 확인</text>
  <text class="k p" x="220" y="722">은행·보증기관에 신탁주택 구조와 필요 서류 제시</text>
  <path class="line" d="M450 760V798"/>

  <rect class="yes" x="70" y="810" width="350" height="120" rx="20"/>
  <text class="k h" x="105" y="854">모두 서면으로 일치</text>
  <text class="k p" x="105" y="889">지급 직전 등기와 계좌 재확인 후 계약</text>
  <rect class="stop" x="480" y="810" width="350" height="120" rx="20"/>
  <text class="k h" x="515" y="854" fill="#8a3f2d">하나라도 불명확</text>
  <text class="k p" x="515" y="889">계약금 지급 중단·원문과 권한 재확인</text>
  <path d="M450 798L245 810" class="line"/>
  <path d="M450 798L655 810" class="line"/>
  <text class="k small" x="450" y="958" text-anchor="middle">정보 기준일 2026-10-14 · 출처: 신탁법, 부동산등기법, HUG 전세사기예방센터</text>
</svg>
