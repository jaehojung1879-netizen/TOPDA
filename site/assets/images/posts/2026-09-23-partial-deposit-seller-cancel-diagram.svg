<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1040" viewBox="0 0 900 1040" role="img" aria-labelledby="title desc">
  <title id="title">계약금 일부 지급 후 매도인이 계약을 깨겠다고 할 때 확인 순서</title>
  <desc id="desc">약정 계약금과 실제 송금액을 구분하고, 나머지 계약금과 중도금 이행 여부를 확인한 다음 계약을 유지할지 위반을 이유로 해제할지 선택한다. 실제 받은 돈 두 배만으로 자동 해제되지 않으며 손해배상액도 자동 확정되지 않는다.</desc>
  <rect width="900" height="1040" fill="#f4f7fb"/>
  <rect x="44" y="38" width="812" height="964" rx="28" fill="#fff" stroke="#d9e2ee" stroke-width="2"/>
  <text x="88" y="99" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="30" font-weight="700" fill="#17324b">받은 돈의 두 배만 보내면 끝일까요?</text>
  <text x="88" y="137" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="20" fill="#566b7d">매매계약서 작성 · 계약금 일부 선지급 후 매도인 해제 통보</text>
  <rect x="88" y="170" width="724" height="136" rx="18" fill="#eaf3fb"/>
  <text x="116" y="213" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#154a75">계약서의 숫자부터 따로 적기</text>
  <text x="116" y="249" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="20" fill="#254762">약정 계약금 1억1천만원 ≠ 실제 선지급 1천만원</text>
  <text x="116" y="279" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="18" fill="#476780">대법원 2014다231378 사건의 실제 계약조건</text>
  <path d="M450 307v48" fill="none" stroke="#7d98b0" stroke-width="3"/>
  <path d="m441 347 9 10 9-10" fill="none" stroke="#7d98b0" stroke-width="3"/>
  <rect x="88" y="359" width="724" height="145" rx="18" fill="#fff5e8" stroke="#ebca9f"/>
  <text x="116" y="400" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#8b4a15">매도인이 2천만원을 보냈다면</text>
  <text x="116" y="437" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="20" fill="#503d2b">실제 받은 1천만원의 두 배만으로</text>
  <text x="116" y="471" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#8b4a15">계약이 자동으로 해제되지는 않음</text>
  <path d="M450 505v48" fill="none" stroke="#7d98b0" stroke-width="3"/>
  <path d="m441 545 9 10 9-10" fill="none" stroke="#7d98b0" stroke-width="3"/>
  <rect x="88" y="556" width="724" height="130" rx="18" fill="#edf5f2"/>
  <text x="116" y="597" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#236550">지금까지 실제로 무엇을 이행했나?</text>
  <text x="116" y="634" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="19" fill="#315c52">나머지 계약금 지급 시도 · 상대방 수령 거절</text>
  <text x="116" y="665" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="19" fill="#315c52">중도금 지급·제공 여부와 계약 특약 확인</text>
  <path d="M450 686v40H234v26m216-26h216v26" fill="none" stroke="#7d98b0" stroke-width="3"/>
  <path d="m225 743 9 10 9-10m414 0 9 10 9-10" fill="none" stroke="#7d98b0" stroke-width="3"/>
  <rect x="88" y="755" width="348" height="153" rx="18" fill="#eaf3fb"/>
  <text x="112" y="794" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#154a75">집을 계속 사고 싶다면</text>
  <text x="112" y="830" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="18" fill="#254762">이행 의사·송금 시도를 기록</text>
  <text x="112" y="860" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="18" fill="#254762">계약 이행 요구 방법 상담</text>
  <rect x="464" y="755" width="348" height="153" rx="18" fill="#edf5f2"/>
  <text x="488" y="794" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="22" font-weight="700" fill="#236550">거래를 끝내려 한다면</text>
  <text x="488" y="830" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="18" fill="#315c52">해제 사유·통지 절차 확인</text>
  <text x="488" y="860" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="18" fill="#315c52">반환금과 손해배상은 구분</text>
  <text x="450" y="949" text-anchor="middle" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="17" fill="#536b7e">약정 계약금 두 배도 매수인이 무조건 받는 확정 금액은 아닙니다.</text>
  <text x="450" y="977" text-anchor="middle" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="15" fill="#72859a">근거: 민법 제565조 · 대법원 2014다231378 · 2026-09-23 확인</text>
</svg>
