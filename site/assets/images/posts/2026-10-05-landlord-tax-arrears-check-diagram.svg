<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1080" viewBox="0 0 900 1080" role="img" aria-labelledby="title desc">
  <title id="title">임대인 동의 없는 미납세금 열람 판단 순서</title>
  <desc id="desc">임대차계약 체결 여부, 보증금 1천만원 초과 여부, 임대차 시작일 전인지 확인한 뒤 국세와 지방세를 각각 열람하고 결과에 따라 잔금 조건을 점검하는 흐름도</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f8ff"/><stop offset="1" stop-color="#eef7f4"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#15324b" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5f7180"/></marker>
    <style>
      .t{font-family:Pretendard,'Noto Sans KR',sans-serif;fill:#172b3a}.h{font-size:34px;font-weight:800}.s{font-size:19px;fill:#536675}.q{font-size:25px;font-weight:750}.b{font-size:20px;font-weight:650}.n{font-size:18px;fill:#536675}.yes{font-size:16px;font-weight:750;fill:#14755c}.no{font-size:16px;font-weight:750;fill:#b25045}.line{fill:none;stroke:#5f7180;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="900" height="1080" rx="38" fill="url(#bg)"/>
  <text class="t h" x="70" y="78">동의 없이 미납세금을 볼 수 있을까?</text>
  <text class="t s" x="70" y="113">계약서에서 아래 세 조건을 차례로 확인하세요</text>

  <g filter="url(#shadow)"><rect x="70" y="155" width="560" height="112" rx="24" fill="#fff" stroke="#ccd8e0"/><text class="t q" x="350" y="202" text-anchor="middle">임대차계약서를 작성했나요?</text><text class="t n" x="350" y="236" text-anchor="middle">계약 전이면 임대인 동의가 필요합니다</text></g>
  <path class="line" d="M350 267v58"/><text class="t yes" x="370" y="303">예</text>
  <path class="line" d="M630 211h48"/><text class="t no" x="644" y="195">아니요</text><rect x="690" y="172" width="160" height="78" rx="18" fill="#fff0ed" stroke="#d7948c"/><text class="t b" x="770" y="204" text-anchor="middle">임대인 동의</text><text class="t n" x="770" y="231" text-anchor="middle">또는 증명서 요청</text>

  <g filter="url(#shadow)"><rect x="70" y="325" width="560" height="112" rx="24" fill="#fff" stroke="#ccd8e0"/><text class="t q" x="350" y="372" text-anchor="middle">보증금이 1천만원을 초과하나요?</text><text class="t n" x="350" y="406" text-anchor="middle">정확히 1천만원이면 임대인 동의가 필요합니다</text></g>
  <path class="line" d="M350 437v58"/><text class="t yes" x="370" y="473">예</text>
  <path class="line" d="M630 381h48"/><text class="t no" x="644" y="365">아니요</text><rect x="690" y="342" width="160" height="78" rx="18" fill="#fff0ed" stroke="#d7948c"/><text class="t b" x="770" y="374" text-anchor="middle">임대인 동의</text><text class="t n" x="770" y="401" text-anchor="middle">필요</text>

  <g filter="url(#shadow)"><rect x="70" y="495" width="560" height="112" rx="24" fill="#fff" stroke="#ccd8e0"/><text class="t q" x="350" y="542" text-anchor="middle">임대차 시작일이 지나지 않았나요?</text><text class="t n" x="350" y="576" text-anchor="middle">계약일부터 시작일 당일까지 신청할 수 있습니다</text></g>
  <path class="line" d="M350 607v58"/><text class="t yes" x="370" y="643">예</text>
  <path class="line" d="M630 551h48"/><text class="t no" x="644" y="535">아니요</text><rect x="690" y="512" width="160" height="78" rx="18" fill="#fff0ed" stroke="#d7948c"/><text class="t b" x="770" y="544" text-anchor="middle">특례 기간</text><text class="t n" x="770" y="571" text-anchor="middle">종료</text>

  <g filter="url(#shadow)"><rect x="80" y="665" width="350" height="138" rx="24" fill="#e3f3ed" stroke="#72ae98"/><text class="t q" x="255" y="711" text-anchor="middle">미납 국세</text><text class="t b" x="255" y="748" text-anchor="middle">전국 세무서</text><text class="t n" x="255" y="779" text-anchor="middle">홈택스 신청 후에도 방문 열람</text></g>
  <g filter="url(#shadow)"><rect x="470" y="665" width="350" height="138" rx="24" fill="#e5effc" stroke="#7ea5d2"/><text class="t q" x="645" y="711" text-anchor="middle">미납 지방세</text><text class="t b" x="645" y="748" text-anchor="middle">시·군·구 세무부서</text><text class="t n" x="645" y="779" text-anchor="middle">전국 지방자치단체 세금 확인</text></g>
  <path class="line" d="M255 803v70h195"/><path class="line" d="M645 803v70H450"/>

  <g filter="url(#shadow)"><rect x="135" y="875" width="630" height="120" rx="24" fill="#fff8df" stroke="#d3b45a"/><text class="t q" x="450" y="921" text-anchor="middle">체납이 보이면 잔금 전에 다시 판단</text><text class="t n" x="450" y="955" text-anchor="middle">완납 증빙·선순위 권리·보증 가입 가능성을 함께 확인</text><text class="t n" x="450" y="982" text-anchor="middle">체납이 없어도 전입신고·확정일자·등기 확인은 별도 진행</text></g>

  <text class="t n" x="450" y="1044" text-anchor="middle">근거: 국세징수법 제109조 · 지방세징수법 제6조 및 시행령 제8조 · 2026-10-05 기준</text>
</svg>
