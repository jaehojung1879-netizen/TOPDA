<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1020" viewBox="0 0 900 1020" role="img" aria-labelledby="title desc">
  <title id="title">전세보증금 지연손해금 계산 시점</title>
  <desc id="desc">계약 종료, 임차권등기 확인, 주택 인도와 통지, 소장 송달, 보증금 반환 순서와 연 5퍼센트 및 연 12퍼센트 적용 가능 구간을 보여 주는 타임라인</desc>
  <rect width="900" height="1020" rx="36" fill="#f5f7fa"/>
  <text x="64" y="72" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="33" font-weight="700" fill="#17243a">지연손해금은 세 날짜를 나눠 봅니다</text>
  <text x="64" y="112" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="18" fill="#586174">예시: 보증금 3억원 · 실제 적용일은 사건별로 다름</text>
  <g font-family="Pretendard,Apple SD Gothic Neo,sans-serif">
    <line x1="150" y1="190" x2="150" y2="890" stroke="#b7c1cf" stroke-width="6"/>
    <circle cx="150" cy="210" r="31" fill="#294b7a"/><text x="150" y="219" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">1</text>
    <rect x="220" y="156" width="610" height="112" rx="20" fill="#fff" stroke="#c9d2df" stroke-width="2"/>
    <text x="258" y="198" font-size="24" font-weight="700" fill="#17243a">10월 31일 · 계약 종료</text>
    <text x="258" y="236" font-size="18" fill="#586174">만기만으로 지연손해금이 자동 시작되는 것은 아님</text>

    <circle cx="150" cy="366" r="31" fill="#7a688e"/><text x="150" y="375" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">2</text>
    <rect x="220" y="312" width="610" height="112" rx="20" fill="#f5f0f8" stroke="#a894ba" stroke-width="2"/>
    <text x="258" y="354" font-size="24" font-weight="700" fill="#392e47">11월 5일 · 임차권등기 확인</text>
    <text x="258" y="392" font-size="18" fill="#655773">이사 전 등기부 기재 확인 · 권리 보전 단계</text>

    <circle cx="150" cy="522" r="31" fill="#337761"/><text x="150" y="531" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">3</text>
    <rect x="220" y="468" width="610" height="112" rx="20" fill="#edf7f3" stroke="#5a9b82" stroke-width="2"/>
    <text x="258" y="510" font-size="24" font-weight="700" fill="#174d3d">11월 10일 · 퇴거·열쇠 전달·통지</text>
    <text x="258" y="548" font-size="18" fill="#456b60">다음 날부터 연 5% 적용 가능 구간 검토</text>

    <circle cx="150" cy="678" r="31" fill="#c18120"/><text x="150" y="687" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">4</text>
    <rect x="220" y="624" width="610" height="112" rx="20" fill="#fff7e8" stroke="#d7ae55" stroke-width="2"/>
    <text x="258" y="666" font-size="24" font-weight="700" fill="#3d3118">12월 20일 · 소장 송달</text>
    <text x="258" y="704" font-size="18" fill="#6d5a33">다음 날부터 연 12% 적용 가능 구간 검토</text>

    <circle cx="150" cy="834" r="31" fill="#294b7a"/><text x="150" y="843" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">5</text>
    <rect x="220" y="780" width="610" height="112" rx="20" fill="#fff" stroke="#c9d2df" stroke-width="2"/>
    <text x="258" y="822" font-size="24" font-weight="700" fill="#17243a">2월 18일 · 보증금 전액 반환</text>
    <text x="258" y="860" font-size="18" fill="#586174">일부 반환이 있었다면 이후 남은 원금으로 계산</text>
  </g>
  <rect x="64" y="930" width="772" height="54" rx="14" fill="#e8edf4"/>
  <text x="450" y="964" text-anchor="middle" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="17" fill="#455166">근거: 민법 제379조·제397조·제536조, 소송촉진법 제3조 · 2026-10-01 확인</text>
</svg>
