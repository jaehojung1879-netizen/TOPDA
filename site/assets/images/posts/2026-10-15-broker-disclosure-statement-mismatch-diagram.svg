<svg xmlns="http://www.w3.org/2000/svg" width="900" height="980" viewBox="0 0 900 980" role="img" aria-labelledby="title desc">
  <title id="title">계약서와 중개대상물 확인·설명서가 다를 때 확인 순서</title>
  <desc id="desc">서명을 멈추고 불일치 항목을 표시한 뒤 등기부·건축물대장·현장 등 원자료와 대조한다. 두 서류를 같은 내용으로 수정하고 다시 확인해 일치하면 서명하며, 확인되지 않으면 계약을 보류한다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6f8fb"/><stop offset="1" stop-color="#eef5f2"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1d3342" flood-opacity=".13"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L10 6 L0 12 Z" fill="#607481"/></marker>
    <style>
      .k{font-family:Pretendard,"Noto Sans KR",Arial,sans-serif}.title{font-size:34px;font-weight:800;fill:#193848}.sub{font-size:18px;fill:#536b77}.box{fill:#fff;stroke:#bfccd2;stroke-width:2}.n{fill:#1f637a}.nt{font-size:18px;font-weight:800;fill:#fff;text-anchor:middle}.h{font-size:24px;font-weight:800;fill:#1d3d4b}.p{font-size:18px;fill:#49616c}.small{font-size:16px;fill:#617781}.ok{fill:#e9f6ef;stroke:#6aae8c;stroke-width:2}.stop{fill:#fff1ec;stroke:#d48268;stroke-width:2}.line{stroke:#607481;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="900" height="980" rx="28" fill="url(#bg)"/>
  <text class="k title" x="60" y="67">두 서류가 다르면 이 순서로 확인하세요</text>
  <text class="k sub" x="60" y="101">말로 정리하지 말고 원자료 → 수정 → 재확인 순서로 진행합니다</text>

  <g filter="url(#shadow)"><rect class="box" x="120" y="140" width="660" height="120" rx="20"/></g>
  <circle class="n" cx="170" cy="200" r="27"/><text class="k nt" x="170" y="207">1</text>
  <text class="k h" x="220" y="187">서명·송금을 잠시 멈추기</text>
  <text class="k p" x="220" y="222">주소·면적·권리·시설 중 다른 항목에 표시</text>
  <path class="line" d="M450 260V300"/>

  <g filter="url(#shadow)"><rect class="box" x="120" y="300" width="660" height="140" rx="20"/></g>
  <circle class="n" cx="170" cy="370" r="27"/><text class="k nt" x="170" y="377">2</text>
  <text class="k h" x="220" y="347">원자료로 맞는 내용 확인</text>
  <text class="k p" x="220" y="382">등기부·건축물대장·현장 사진·관리비 자료</text>
  <text class="k small" x="220" y="414">확인 불가·자료 거부 사실도 확인·설명서에 기록</text>
  <path class="line" d="M450 440V480"/>

  <g filter="url(#shadow)"><rect class="box" x="120" y="480" width="660" height="140" rx="20"/></g>
  <circle class="n" cx="170" cy="550" r="27"/><text class="k nt" x="170" y="557">3</text>
  <text class="k h" x="220" y="527">계약서와 확인·설명서 함께 수정</text>
  <text class="k p" x="220" y="562">특약·권리관계·시설 상태를 같은 내용으로 정정</text>
  <text class="k small" x="220" y="594">수정 부분에 당사자와 중개사의 확인을 남김</text>
  <path class="line" d="M450 620V660"/>

  <g filter="url(#shadow)"><path d="M450 660 640 755 450 850 260 755Z" fill="#234f63"/></g>
  <text class="k" x="450" y="742" text-anchor="middle" style="font-size:25px;font-weight:800;fill:#fff">원자료와 두 서류가</text>
  <text class="k" x="450" y="778" text-anchor="middle" style="font-size:25px;font-weight:800;fill:#fff">모두 일치하는가?</text>

  <path class="line" d="M260 755H175V858"/>
  <path class="line" d="M640 755H725V858"/>
  <text class="k small" x="184" y="738" font-weight="800" fill="#a34f36">아니요</text>
  <text class="k small" x="670" y="738" font-weight="800" fill="#317855">예</text>
  <rect class="stop" x="55" y="858" width="335" height="85" rx="18"/>
  <text class="k h" x="90" y="894" fill="#914933">계약 보류</text>
  <text class="k p" x="90" y="924">확인될 때까지 추가 지급 중단</text>
  <rect class="ok" x="510" y="858" width="335" height="85" rx="18"/>
  <text class="k h" x="545" y="894" fill="#2d7653">재확인 후 서명</text>
  <text class="k p" x="545" y="924">사본·근거자료·공제증서 보관</text>
  <text class="k small" x="450" y="966" text-anchor="middle">정보 기준일 2026-10-15 · 근거: 공인중개사법 제25조·제30조, 시행령 제21조</text>
</svg>
