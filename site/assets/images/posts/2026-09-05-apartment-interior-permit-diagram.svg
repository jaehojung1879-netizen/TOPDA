<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 920" role="img" aria-labelledby="title desc">
  <title id="title">아파트 인테리어 공사 전 확인하는 네 단계</title>
  <desc id="desc">공사 범위 표시, 도면으로 구조 확인, 관리사무소와 관할 시군구 확인, 허가 신고 동의 완료 후 착공 순서</desc>
  <rect width="760" height="920" rx="32" fill="#f7f9fc"/>
  <text x="380" y="58" text-anchor="middle" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="30" font-weight="700" fill="#172033">철거 전에 허가 대상을 먼저 가르세요</text>
  <text x="380" y="96" text-anchor="middle" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="21" fill="#5b6474">견적·계약보다 먼저 구조와 행정 절차를 확인하는 순서</text>

  <g font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
    <rect x="56" y="132" width="648" height="126" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="120" cy="195" r="35" fill="#195fb5"/>
    <text x="120" y="206" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff">1</text>
    <text x="176" y="183" font-size="28" font-weight="700" fill="#172033">공사 범위를 도면에 표시</text>
    <text x="176" y="221" font-size="22" fill="#5b6474">벽·배관·창호·발코니·공용부 변경 위치</text>

    <path d="M380 258v34" stroke="#87a6cc" stroke-width="5" stroke-linecap="round"/>
    <path d="m366 282 14 16 14-16" fill="none" stroke="#87a6cc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="56" y="304" width="648" height="126" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="120" cy="367" r="35" fill="#195fb5"/>
    <text x="120" y="378" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff">2</text>
    <text x="176" y="355" font-size="28" font-weight="700" fill="#172033">도면으로 구조·소유 구분</text>
    <text x="176" y="393" font-size="22" fill="#5b6474">내력벽/비내력벽, 전유부분/공용부분 확인</text>

    <path d="M380 430v34" stroke="#87a6cc" stroke-width="5" stroke-linecap="round"/>
    <path d="m366 454 14 16 14-16" fill="none" stroke="#87a6cc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="56" y="476" width="648" height="142" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="120" cy="547" r="35" fill="#0f8a74"/>
    <text x="120" y="558" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff">3</text>
    <text x="176" y="531" font-size="28" font-weight="700" fill="#172033">두 곳에 각각 사전 확인</text>
    <text x="176" y="571" font-size="22" fill="#5b6474">관리사무소: 단지 규정·보양·작업시간</text>
    <text x="176" y="603" font-size="22" fill="#5b6474">시·군·구: 행위허가·신고·동의·제출서류</text>

    <path d="M380 618v34" stroke="#87a6cc" stroke-width="5" stroke-linecap="round"/>
    <path d="m366 642 14 16 14-16" fill="none" stroke="#87a6cc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="56" y="664" width="648" height="126" rx="22" fill="#eaf3ff" stroke="#195fb5" stroke-width="2"/>
    <circle cx="120" cy="727" r="35" fill="#195fb5"/>
    <text x="120" y="738" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff">4</text>
    <text x="176" y="715" font-size="28" font-weight="700" fill="#172033">서류 완료 뒤 착공</text>
    <text x="176" y="753" font-size="22" fill="#5b6474">조건부 계약 → 증명서 보관 → 완료 후 사용검사</text>

    <rect x="76" y="824" width="608" height="58" rx="16" fill="#fff4e5" stroke="#e59b32" stroke-width="2"/>
    <text x="380" y="861" text-anchor="middle" font-size="24" font-weight="700" fill="#8a4f00">관리사무소 승인 ≠ 시·군·구 행위허가</text>
  </g>
</svg>
