<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1040" viewBox="0 0 900 1040" role="img" aria-labelledby="title desc">
<title id="title">주택 재산세 고지 시기 확인</title>
<desc id="desc">6월 1일 소유자를 기준으로 납세자를 정하고, 주택분 재산세액이 20만원 이하이면 7월 일괄 부과할 수 있으며, 이를 넘으면 7월과 9월에 절반씩 고지하는 흐름이다.</desc>
<rect width="900" height="1040" rx="36" fill="#f5f7f4"/>
<text x="70" y="82" font-family="Pretendard,Arial,sans-serif" font-size="34" font-weight="700" fill="#16251d">재산세 고지서가 두 번 오는 이유</text>
<text x="70" y="124" font-family="Pretendard,Arial,sans-serif" font-size="19" fill="#53645b">주택분 기준 · 실제 금액과 기한은 고지서에서 확인</text>
<rect x="70" y="175" width="760" height="150" rx="24" fill="#ffffff" stroke="#cddbd2" stroke-width="2"/>
<circle cx="135" cy="250" r="42" fill="#176b4b"/>
<text x="135" y="260" text-anchor="middle" font-family="Pretendard,Arial,sans-serif" font-size="28" font-weight="700" fill="#fff">6/1</text>
<text x="205" y="232" font-family="Pretendard,Arial,sans-serif" font-size="26" font-weight="700" fill="#17231c">누가 낼지 정하는 날</text>
<text x="205" y="272" font-family="Pretendard,Arial,sans-serif" font-size="20" fill="#43534a">매년 6월 1일 현재 사실상 소유자가 그해 납세자</text>
<text x="205" y="302" font-family="Pretendard,Arial,sans-serif" font-size="18" fill="#6a776f">집을 팔았더라도 이 날짜의 소유 관계부터 확인</text>
<path d="M450 326v66" stroke="#96aa9e" stroke-width="4"/>
<path d="M440 382l10 14 10-14" fill="none" stroke="#96aa9e" stroke-width="4"/>
<rect x="235" y="405" width="430" height="105" rx="24" fill="#e6f1eb" stroke="#a7c6b5" stroke-width="2"/>
<text x="450" y="449" text-anchor="middle" font-family="Pretendard,Arial,sans-serif" font-size="24" font-weight="700" fill="#174c37">주택분 재산세액 확인</text>
<text x="450" y="485" text-anchor="middle" font-family="Pretendard,Arial,sans-serif" font-size="19" fill="#385b49">20만원 이하인가, 초과인가?</text>
<path d="M450 510v52M450 562H245M450 562h205" stroke="#96aa9e" stroke-width="4" fill="none"/>
<path d="M235 552l-14 10 14 10M665 552l14 10-14 10" stroke="#96aa9e" stroke-width="4" fill="none"/>
<rect x="55" y="585" width="350" height="200" rx="26" fill="#fff8e8" stroke="#e0c786" stroke-width="2"/>
<text x="230" y="632" text-anchor="middle" font-family="Pretendard,Arial,sans-serif" font-size="23" font-weight="700" fill="#6c5115">20만원 이하</text>
<text x="230" y="678" text-anchor="middle" font-family="Pretendard,Arial,sans-serif" font-size="27" font-weight="700" fill="#332b19">7월에 전액 고지 가능</text>
<text x="230" y="720" text-anchor="middle" font-family="Pretendard,Arial,sans-serif" font-size="18" fill="#62573e">지자체 조례에 따라 한꺼번에 부과</text>
<text x="230" y="751" text-anchor="middle" font-family="Pretendard,Arial,sans-serif" font-size="18" fill="#62573e">9월 2기분이 없을 수 있음</text>
<rect x="495" y="585" width="350" height="200" rx="26" fill="#eef4fb" stroke="#abc5df" stroke-width="2"/>
<text x="670" y="632" text-anchor="middle" font-family="Pretendard,Arial,sans-serif" font-size="23" font-weight="700" fill="#28577d">20만원 초과</text>
<text x="670" y="678" text-anchor="middle" font-family="Pretendard,Arial,sans-serif" font-size="27" font-weight="700" fill="#1b2c3b">7월·9월 절반씩</text>
<text x="670" y="720" text-anchor="middle" font-family="Pretendard,Arial,sans-serif" font-size="18" fill="#4a5f70">7월 16~31일 · 주택 1기분</text>
<text x="670" y="751" text-anchor="middle" font-family="Pretendard,Arial,sans-serif" font-size="18" fill="#4a5f70">9월 16~30일 · 주택 2기분</text>
<rect x="70" y="835" width="760" height="135" rx="24" fill="#1b3226"/>
<text x="105" y="878" font-family="Pretendard,Arial,sans-serif" font-size="22" font-weight="700" fill="#d8eee1">9월 고지서를 받았다면</text>
<text x="105" y="918" font-family="Pretendard,Arial,sans-serif" font-size="19" fill="#fff">① 과세대상 주소  ② 주택 2기분  ③ 납세자 이름</text>
<text x="105" y="950" font-family="Pretendard,Arial,sans-serif" font-size="19" fill="#fff">④ 재산세 본세  ⑤ 7월 납부 완료 여부를 비교하세요.</text>
<text x="70" y="1010" font-family="Pretendard,Arial,sans-serif" font-size="16" fill="#6a776f">근거: 지방세법 제114조·제115조 · 2026-09-24 확인</text>
</svg>
