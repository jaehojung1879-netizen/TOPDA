<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1120" viewBox="0 0 900 1120" role="img" aria-labelledby="title desc">
  <title id="title">부부 공동명의 지분과 실제 자금 부담을 맞추는 순서</title>
  <desc id="desc">각 배우자의 현금과 실제 대출 부담을 합친 다음 등기 지분가액과 비교하고, 차이가 있으면 증여와 배우자 공제, 신고를 확인하는 흐름도</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6faf9"/><stop offset="1" stop-color="#eef3f8"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#12352e" flood-opacity=".10"/></filter>
    <style>
      text{font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;fill:#17342f}
      .h{font-size:36px;font-weight:800}.sub{font-size:19px;fill:#55706a}
      .num{font-size:18px;font-weight:800;fill:#fff}.t{font-size:25px;font-weight:750}
      .b{font-size:18px;fill:#4b6661}.small{font-size:16px;fill:#5f746f}
      .arrow{stroke:#7aa398;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="900" height="1120" rx="36" fill="url(#bg)"/>
  <text class="h" x="450" y="72" text-anchor="middle">공동명의 지분, 무엇부터 맞출까?</text>
  <text class="sub" x="450" y="108" text-anchor="middle">등기 비율보다 실제 부담액을 먼저 계산하세요</text>

  <g filter="url(#shadow)">
    <rect x="90" y="150" width="720" height="160" rx="26" fill="#fff"/>
    <circle cx="150" cy="210" r="31" fill="#2c7a69"/><text class="num" x="150" y="217" text-anchor="middle">1</text>
    <text class="t" x="205" y="195">각자의 자기자금 확인</text>
    <text class="b" x="205" y="231">예금 · 기존 보증금 · 자산 처분대금 · 부모 증여</text>
    <text class="small" x="205" y="268">돈의 원래 소유자와 계좌 흐름을 함께 남깁니다.</text>
  </g>
  <path class="arrow" d="M450 310v45"/><path d="M438 346l12 15 12-15" fill="none" stroke="#7aa398" stroke-width="5"/>

  <g filter="url(#shadow)">
    <rect x="90" y="370" width="720" height="160" rx="26" fill="#fff"/>
    <circle cx="150" cy="430" r="31" fill="#2c7a69"/><text class="num" x="150" y="437" text-anchor="middle">2</text>
    <text class="t" x="205" y="415">대출의 실제 부담 확인</text>
    <text class="b" x="205" y="451">채무자 · 공동채무자 · 상환계좌 · 소득과 상환능력</text>
    <text class="small" x="205" y="488">담보제공만 했는지 실제 원리금을 갚는지도 구분합니다.</text>
  </g>
  <path class="arrow" d="M450 530v45"/><path d="M438 566l12 15 12-15" fill="none" stroke="#7aa398" stroke-width="5"/>

  <g filter="url(#shadow)">
    <rect x="90" y="590" width="720" height="170" rx="26" fill="#fff"/>
    <circle cx="150" cy="650" r="31" fill="#2c7a69"/><text class="num" x="150" y="657" text-anchor="middle">3</text>
    <text class="t" x="205" y="635">등기 지분가액과 비교</text>
    <text class="b" x="205" y="674">지분가액 − 실제 부담액 = 설명이 필요한 차액</text>
    <rect x="205" y="702" width="500" height="35" rx="17" fill="#e5f2ee"/>
    <text class="small" x="455" y="726" text-anchor="middle">차액이 0이면 자금과 지분이 맞고, 양수면 다음 단계로</text>
  </g>
  <path class="arrow" d="M450 760v45"/><path d="M438 796l12 15 12-15" fill="none" stroke="#7aa398" stroke-width="5"/>

  <g filter="url(#shadow)">
    <rect x="90" y="820" width="720" height="190" rx="26" fill="#fff"/>
    <circle cx="150" cy="880" r="31" fill="#d37a39"/><text class="num" x="150" y="887" text-anchor="middle">4</text>
    <text class="t" x="205" y="865">차액의 성격과 신고 확인</text>
    <text class="b" x="205" y="903">증여인가 · 실제 대여인가 · 다른 채권·채무 정산인가</text>
    <text class="b" x="205" y="940">최근 10년 배우자 증여와 6억원 공제 사용액 확인</text>
    <text class="small" x="205" y="978">증여라면 받은 달 말일부터 3개월 이내 신고 여부를 검토합니다.</text>
  </g>
  <text class="small" x="450" y="1064" text-anchor="middle">정보 기준일 2026-09-28 · 출처: 국세청, 상속세 및 증여세법 제53조</text>
</svg>

