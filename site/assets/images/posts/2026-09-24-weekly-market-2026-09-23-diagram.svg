<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1060" viewBox="0 0 900 1060" role="img" aria-labelledby="title desc">
  <title id="title">추석 전 주택시장 공식 발표 세 가지</title>
  <desc id="desc">9월 15일 발표된 8월 주택가격과 코픽스, 9월 23일 발표된 청약통장 전환 연장을 날짜순으로 정리한 도식</desc>
  <rect width="900" height="1060" rx="32" fill="#f5f1e8"/>
  <text x="64" y="82" fill="#172f4f" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="34" font-weight="800">추석 전 열흘, 무엇이 달라졌나</text>
  <text x="64" y="122" fill="#667085" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="18">2026.09.14~09.23 · 발표일과 통계 기준시점을 구분해 읽기</text>

  <line x1="116" y1="194" x2="116" y2="876" stroke="#b9a06a" stroke-width="4"/>
  <circle cx="116" cy="244" r="18" fill="#172f4f"/>
  <circle cx="116" cy="498" r="18" fill="#172f4f"/>
  <circle cx="116" cy="752" r="18" fill="#b58a45"/>

  <text x="64" y="247" fill="#fff" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="13" font-weight="800" text-anchor="middle"></text>
  <rect x="166" y="176" width="670" height="186" rx="22" fill="#fff" stroke="#d8d2c5"/>
  <text x="202" y="216" fill="#b58a45" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="17" font-weight="800">9월 15일 · 한국부동산원</text>
  <text x="202" y="258" fill="#172f4f" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="27" font-weight="800">서울 주택 매매 +0.97%</text>
  <text x="202" y="294" fill="#344054" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="19">전월 +1.09%에서 0.12%p 둔화</text>
  <text x="202" y="326" fill="#667085" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="17">상승 종료가 아니라 상승 속도 축소 · 8월 한 달 기준</text>

  <rect x="166" y="430" width="670" height="186" rx="22" fill="#fff" stroke="#d8d2c5"/>
  <text x="202" y="470" fill="#b58a45" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="17" font-weight="800">9월 15일 · 전국은행연합회</text>
  <text x="202" y="512" fill="#172f4f" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="27" font-weight="800">신규 코픽스 3.18% · 전월 동일</text>
  <text x="202" y="548" fill="#344054" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="19">잔액 3.05%(+0.05%p) · 신잔액 2.71%(+0.06%p)</text>
  <text x="202" y="580" fill="#667085" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="17">내 약정의 기준값과 금리 변경일을 따로 확인</text>

  <rect x="166" y="684" width="670" height="186" rx="22" fill="#fff" stroke="#d8d2c5"/>
  <text x="202" y="724" fill="#b58a45" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="17" font-weight="800">9월 23일 · 국토교통부</text>
  <text x="202" y="766" fill="#172f4f" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="27" font-weight="800">청약통장 전환 2027.9.30까지</text>
  <text x="202" y="802" fill="#344054" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="19">예금·부금·저축 → 주택청약종합저축</text>
  <text x="202" y="834" fill="#667085" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="17">기한 1년 연장 · 금리 산정에 종전 가입기간 인정 예정</text>

  <rect x="64" y="918" width="772" height="82" rx="18" fill="#172f4f"/>
  <text x="92" y="951" fill="#fff" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="19" font-weight="800">9월 23일 마감 원칙</text>
  <text x="92" y="980" fill="#dce4ef" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="16">9월 21일 기준 주간 가격은 아직 공식 발표 전이라 다음 브리핑에서 확인</text>
  <text x="64" y="1034" fill="#667085" font-family="Pretendard,Apple SD Gothic Neo,sans-serif" font-size="14">자료: 한국부동산원 · 전국은행연합회 · 국토교통부 (2026-09-23 확인)</text>
</svg>
