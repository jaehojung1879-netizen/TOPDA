<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1080" viewBox="0 0 900 1080" role="img" aria-labelledby="title desc">
  <title id="title">전 소유자 체납 관리비 확인 흐름도</title>
  <desc id="desc">관리사무소 청구액을 소유권 취득 전후로 나누고, 취득 전 금액은 공용부분 원금, 전유부분 사용료, 연체료로 다시 구분해 새 소유자 부담 가능성을 판단하는 절차를 보여준다.</desc>
  <rect width="900" height="1080" rx="34" fill="#f7f8fb"/>
  <text x="60" y="76" font-family="Pretendard, Arial, sans-serif" font-size="36" font-weight="800" fill="#17233c">체납 관리비, 합계부터 내지 마세요</text>
  <text x="60" y="118" font-family="Pretendard, Arial, sans-serif" font-size="21" fill="#53617b">소유권 취득일과 실제 사용처를 기준으로 나눠 확인합니다</text>

  <rect x="150" y="166" width="600" height="104" rx="22" fill="#17233c"/>
  <text x="450" y="210" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="24" font-weight="800" fill="#fff">관리사무소 체납액 상세내역 요청</text>
  <text x="450" y="244" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="18" fill="#dce4f1">월별 금액 · 공용/전유 · 연체료 · 소유권 취득일</text>
  <path d="M450 270v56" stroke="#9aabc4" stroke-width="5"/>
  <path d="m439 316 11 16 11-16" fill="#9aabc4"/>

  <rect x="105" y="332" width="690" height="106" rx="22" fill="#fff" stroke="#d9e1ed" stroke-width="2"/>
  <text x="450" y="376" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="25" font-weight="800" fill="#17233c">언제 발생한 금액인가?</text>
  <text x="450" y="410" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="19" fill="#53617b">소유권을 취득한 날 전후로 먼저 구분</text>
  <path d="M450 438v48M450 486H230v46M450 486h220v46" fill="none" stroke="#9aabc4" stroke-width="5"/>

  <rect x="65" y="532" width="330" height="118" rx="22" fill="#eef4ff" stroke="#a8c0f4" stroke-width="2"/>
  <text x="230" y="576" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="23" font-weight="800" fill="#245cc7">취득일 이후 발생</text>
  <text x="230" y="612" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="19" fill="#53617b">현재 소유자·사용자 부담관계 확인</text>

  <rect x="505" y="532" width="330" height="118" rx="22" fill="#fff9f1" stroke="#efc394" stroke-width="2"/>
  <text x="670" y="576" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="23" font-weight="800" fill="#b45a13">취득일 이전 발생</text>
  <text x="670" y="612" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="19" fill="#53617b">비용 성격을 다시 구분</text>
  <path d="M670 650v58M670 708H160v40M670 708H450v40M670 708v40" fill="none" stroke="#9aabc4" stroke-width="5"/>

  <rect x="45" y="748" width="230" height="170" rx="22" fill="#f1fbf7" stroke="#9ed8c4" stroke-width="2"/>
  <text x="160" y="792" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="23" font-weight="800" fill="#087854">공용부분 원금</text>
  <text x="160" y="832" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="18" fill="#53617b">청소·승강기·일반관리</text>
  <text x="160" y="864" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="18" fill="#53617b">등 공동 유지비</text>
  <text x="160" y="898" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="19" font-weight="700" fill="#087854">새 소유자 청구 가능</text>

  <rect x="335" y="748" width="230" height="170" rx="22" fill="#fff" stroke="#d9e1ed" stroke-width="2"/>
  <text x="450" y="792" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="23" font-weight="800" fill="#17233c">전유부분 사용료</text>
  <text x="450" y="832" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="18" fill="#53617b">세대 전기·수도·급탕</text>
  <text x="450" y="864" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="18" fill="#53617b">등 개별 사용분</text>
  <text x="450" y="898" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="19" font-weight="700" fill="#17233c">전 소유자·사용자 확인</text>

  <rect x="625" y="748" width="230" height="170" rx="22" fill="#fff4f4" stroke="#e9adad" stroke-width="2"/>
  <text x="740" y="792" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="23" font-weight="800" fill="#b23b3b">연체료</text>
  <text x="740" y="832" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="18" fill="#53617b">전 소유자의 지급 지연에</text>
  <text x="740" y="864" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="18" fill="#53617b">따라 붙은 금액</text>
  <text x="740" y="898" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="19" font-weight="700" fill="#b23b3b">새 소유자 승계 제외</text>

  <rect x="60" y="958" width="780" height="78" rx="18" fill="#17233c"/>
  <text x="450" y="990" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="21" font-weight="800" fill="#fff">일반 매매라면 잔금 전에 매도인 완납 또는 서면 공제</text>
  <text x="450" y="1019" text-anchor="middle" font-family="Pretendard, Arial, sans-serif" font-size="17" fill="#dce4f1">경매라면 공용부분 체납 가능액을 입찰가에 반영</text>
  <text x="60" y="1065" font-family="Pretendard, Arial, sans-serif" font-size="16" fill="#6d7890">기준일 2026-09-19 · 실제 분류는 관리규약과 구체적인 사용내역에 따라 달라질 수 있습니다.</text>
</svg>
