<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1060" viewBox="0 0 900 1060" role="img" aria-labelledby="title desc">
  <title id="title">층간소음이 계속될 때 대응 순서</title>
  <desc id="desc">소음 발생 기록, 관리사무소 중재, 단지 층간소음관리위원회, 층간소음 이웃사이센터 상담과 측정, 분쟁조정 순서를 보여 주는 흐름도</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0f172a" flood-opacity=".09"/>
    </filter>
    <style>
      text{font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;fill:#172033}
      .step{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:18;filter:url(#shadow)}
      .num{fill:#2563eb}.numtext{fill:#fff;font-size:24px;font-weight:800;text-anchor:middle}
      .head{font-size:25px;font-weight:800}.body{font-size:18px;fill:#475569}
      .arrow{stroke:#64748b;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="900" height="1060" rx="28" fill="url(#bg)"/>
  <text x="450" y="65" text-anchor="middle" font-size="34" font-weight="850">층간소음이 계속될 때 이렇게 대응하세요</text>
  <text x="450" y="101" text-anchor="middle" font-size="18" fill="#64748b">윗집으로 단정하거나 바로 찾아가기보다 기록과 중재부터 시작합니다</text>

  <g transform="translate(105 140)">
    <rect class="step" width="690" height="132"/>
    <circle class="num" cx="54" cy="66" r="28"/><text class="numtext" x="54" y="75">1</text>
    <text class="head" x="105" y="51">날짜·시간·소리 유형을 기록</text>
    <text class="body" x="105" y="84">시작·종료 시각, 들린 방, 뛰는 소리인지 TV 소리인지 적기</text>
    <text class="body" x="105" y="111">위층·옆집·대각선 세대 등 발생원을 미리 단정하지 않기</text>
  </g>
  <path class="arrow" d="M450 282v38m-10-10 10 10 10-10"/>

  <g transform="translate(105 330)">
    <rect class="step" width="690" height="132"/>
    <circle class="num" cx="54" cy="66" r="28"/><text class="numtext" x="54" y="75">2</text>
    <text class="head" x="105" y="51">관리사무소에 중재 요청</text>
    <text class="body" x="105" y="84">기록을 전달하고 발생 세대 확인과 소음 중단 권고를 요청</text>
    <text class="body" x="105" y="111">민원 접수일·답변·방송이나 연락 결과를 함께 보관</text>
  </g>
  <path class="arrow" d="M450 472v38m-10-10 10 10 10-10"/>

  <g transform="translate(105 520)">
    <rect class="step" width="690" height="132"/>
    <circle class="num" cx="54" cy="66" r="28"/><text class="numtext" x="54" y="75">3</text>
    <text class="head" x="105" y="51">단지 층간소음관리위원회 조정</text>
    <text class="body" x="105" y="84">중재 뒤에도 계속되면 관리규약과 위원회 운영 여부 확인</text>
    <text class="body" x="105" y="111">당사자 의견을 듣고 생활시간·완화 방법을 구체적으로 조정</text>
  </g>
  <path class="arrow" d="M450 662v38m-10-10 10 10 10-10"/>

  <g transform="translate(105 710)">
    <rect class="step" width="690" height="142"/>
    <circle class="num" cx="54" cy="71" r="28"/><text class="numtext" x="54" y="80">4</text>
    <text class="head" x="105" y="48">층간소음 이웃사이센터 이용</text>
    <text class="body" x="105" y="81">전화상담 → 방문상담 → 필요 시 소음측정 순서</text>
    <text class="body" x="105" y="110">1661-2642, 평일 09:00~18:00</text>
    <text class="body" x="105" y="136">※ 점심시간 12:00~13:00 제외</text>
  </g>
  <path class="arrow" d="M450 862v38m-10-10 10 10 10-10"/>

  <g transform="translate(105 910)">
    <rect class="step" width="690" height="120"/>
    <circle class="num" cx="54" cy="60" r="28"/><text class="numtext" x="54" y="69">5</text>
    <text class="head" x="105" y="48">해결되지 않으면 분쟁조정 신청</text>
    <text class="body" x="105" y="82">공동주택관리 또는 환경분쟁 조정기관의 관할·요건 확인</text>
  </g>

</svg>
