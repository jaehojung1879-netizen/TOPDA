  <div class="article-header">
    <div class="breadcrumb"><a href="../index.html">首頁</a> / <a href="index.html">計算器</a> / Jeonse ↔ 月租</div>
    <h1>Jeonse（全租）↔ 月租 換算器</h1>
    <div class="meta"><span>採用全租↔月租換算率（전월세전환율）。</span></div>
  </div>
  <div class="calc-layout" data-calc="jeonse-monthly">
    <div class="calc-form">
      <div class="field"><label>換算方向</label>
        <div class="radio-group">
          <label><input type="radio" name="mode" value="toMonthly" checked/><span>全租 → 月租</span></label>
          <label><input type="radio" name="mode" value="toJeonse"/><span>月租 → 全租</span></label>
        </div>
      </div>
      <div class="field"><label for="jm-deposit">目前全租押金（KRW）</label>
        <div class="input-suffix" data-suffix="KRW"><input id="jm-deposit" name="deposit" type="text" inputmode="numeric" data-format="won" value="500,000,000" /></div>
      </div>
      <div class="field" data-mode="toMonthly"><label for="jm-base">換算後保留的押金（KRW）</label>
        <div class="input-suffix" data-suffix="KRW"><input id="jm-base" name="baseDeposit" type="text" inputmode="numeric" data-format="won" value="100,000,000" /></div>
        <span class="hint">不換成月租、想保留的押金。</span>
      </div>
      <div class="field"><label for="jm-monthly">月租（KRW）</label>
        <div class="input-suffix" data-suffix="KRW"><input id="jm-monthly" name="monthly" type="text" inputmode="numeric" data-format="won" value="1,000,000" /></div>
        <span class="hint">在「月租 → 全租」方向作為輸入。</span>
      </div>
      <div class="field"><label for="jm-rate">換算率（%/年）</label>
        <input id="jm-rate" name="rate" type="number" min="1" max="15" step="0.1" value="5.5" />
        <span class="hint">法定上限 = 韓國央行基準利率+2% 與 10%/年 中較低者。</span>
      </div>
    </div>
    <div class="calc-result">
      <h3>結果</h3>
      <div data-mode="toMonthly">
        <div class="total"><span data-out="outMonthly">KRW 0</span> / 月</div>
        <div class="breakdown">
          <div class="row"><span class="key">保留押金</span><span class="val" data-out="outBaseDeposit">KRW 0</span></div>
          <div class="row sub"><span class="key">由押金換算</span><span class="val" data-out="outConverted">KRW 0</span></div>
        </div>
      </div>
      <div data-mode="toJeonse" style="display:none;">
        <div class="total" data-out="outTotalDeposit">KRW 0</div>
        <div class="breakdown"><div class="row sub"><span class="key">由月租換算增加</span><span class="val" data-out="outAddedDeposit">KRW 0</span></div></div>
      </div>
      <div class="breakdown" style="margin-top:16px;"><div class="row"><span class="key">適用換算率</span><span class="val" data-out="outRate">—</span></div></div>
      <div class="callout callout-info" style="margin-top:24px; margin-bottom:0;"><div class="icon">i</div><div class="body">換算率由法律規定；實際市場利率可能不同。公式：月租 =（押金 − 保留）× 換算率 ÷ 12。</div></div>
    </div>
  </div>
