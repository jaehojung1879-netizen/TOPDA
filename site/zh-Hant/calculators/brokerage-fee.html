    <h1>仲介手續費計算器</h1>
    <div class="meta"><span>首爾上限費率 · 實際可協商 · 另加加值稅</span></div>
  </div>
  <div class="calc-layout" data-calc="brokerage-fee">
    <div class="calc-form">
      <div class="field"><label>交易類型</label>
        <div class="radio-group">
          <label><input type="radio" name="type" value="sale" checked/><span>買賣 (매매)</span></label>
          <label><input type="radio" name="type" value="jeonse"/><span>全租 (전세)</span></label>
        </div>
      </div>
      <div class="field"><label for="price">交易金額（KRW）</label>
        <div class="input-suffix" data-suffix="KRW"><input id="price" name="price" type="text" inputmode="numeric" data-format="won" value="500,000,000" /></div>
        <span class="hint">買賣填成交價；全租填押金。</span>
      </div>
    </div>
    <div class="calc-result">
      <h3>最高合計（含加值稅）</h3>
      <div class="total" data-out="total">KRW 0</div>
      <div class="breakdown">
        <div class="row"><span class="key">費率</span><span class="val" data-out="rate">—</span></div>
        <div class="row"><span class="key">上限</span><span class="val" data-out="cap">—</span></div>
        <div class="row sub"><span class="key">佣金（不含稅）</span><span class="val" data-out="fee">KRW 0</span></div>
        <div class="row sub"><span class="key">加值稅（10%）</span><span class="val" data-out="vat">KRW 0</span></div>
      </div>
      <div class="callout callout-info" style="margin-top:24px; margin-bottom:0;"><div class="icon">i</div><div class="body">這是上限而非固定費率，實際可協商。僅當仲介為一般納稅人時收取加值稅。</div></div>
    </div>
  </div>
