    <div class="breadcrumb"><a href="../index.html">首頁</a> / <a href="index.html">計算器</a> / 取得稅</div>
    <h1>取得稅計算器</h1>
    <div class="meta"><span>住宅 · 標準稅率 · 外國人適用同樣稅率</span></div>
  </div>
  <div class="calc-layout" data-calc="acquisition-tax">
    <div class="calc-form">
      <div class="field"><label for="price">取得價（成交價，KRW）</label>
        <div class="input-suffix" data-suffix="KRW"><input id="price" name="price" type="text" inputmode="numeric" data-format="won" value="800,000,000" /></div>
        <span class="hint">實際合約價。</span>
      </div>
      <div class="field"><label>房屋數（含本次）</label>
        <div class="radio-group">
          <label><input type="radio" name="homes" value="1" checked/><span>1戶</span></label>
          <label><input type="radio" name="homes" value="2"/><span>2戶</span></label>
          <label><input type="radio" name="homes" value="3"/><span>3戶</span></label>
          <label><input type="radio" name="homes" value="4"/><span>4戶以上</span></label>
        </div>
        <span class="hint">以家庭為單位持有的戶數。</span>
      </div>
      <div class="field"><label class="check-item" style="padding:0; cursor:pointer;">
        <input type="checkbox" name="regulated"/><span class="text">位於調整對象地區（조정대상지역）<span class="note">自第2戶起適用重課稅率。</span></span>
      </label></div>
      <div class="field"><label class="check-item" style="padding:0; cursor:pointer;">
        <input type="checkbox" name="areaOver85"/><span class="text">專用面積 > 85㎡<span class="note">觸發 0.2% 農漁村特別稅。</span></span>
      </label></div>
    </div>
    <div class="calc-result">
      <h3>預計合計</h3>
      <div class="result-scenario" data-out="scenario">請輸入價格</div>
      <div class="total" data-out="total">KRW 0</div>
      <div class="breakdown">
        <div class="row"><span class="key">適用稅率</span><span class="val" data-out="rate">—</span></div>
        <div class="row sub"><span class="key">取得稅</span><span class="val" data-out="acquisition">KRW 0</span></div>
        <div class="row sub"><span class="key">農漁村特別稅</span><span class="val" data-out="ruralTax">KRW 0</span></div>
        <div class="row sub"><span class="key">地方教育稅</span><span class="val" data-out="localEduTax">KRW 0</span></div>
      </div>
      <div class="callout callout-info" style="margin-top:24px; margin-bottom:0;"><div class="icon">i</div><div class="body">僅按標準稅率。未含生涯首購減免、預售權等情形。非標準情形請諮詢稅務師。</div></div>
    </div>
  </div>
