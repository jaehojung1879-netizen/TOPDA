<meta charset="utf-8" />

<link rel="stylesheet" href="../assets/styles.css?v=20260611" />
<style>
  .tx-controls { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin-bottom:20px; }
  .tx-field label { display:block; font-size:0.82rem; font-weight:600; margin-bottom:6px; color:var(--text-muted); }
  .tx-field select, .tx-field input { padding:10px 12px; border:1px solid var(--border,#d1d5db); border-radius:10px; font-size:0.95rem; font-family:inherit; background:#fff; min-width:150px; width:100%; box-sizing:border-box; }
  .tx-link { color:var(--accent,#2563eb); text-decoration:none; font-weight:600; }
  .tx-link:hover { text-decoration:underline; }
  .tx-stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:20px; }
  .tx-stat { border:1px solid var(--border,#e5e7eb); border-radius:14px; padding:14px 16px; background:#fff; }
  .tx-stat .lbl { font-size:0.78rem; color:var(--text-muted); }
  .tx-stat .num { font-size:1.4rem; font-weight:800; margin-top:4px; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; }
  .tx-chart { border:1px solid var(--border,#e5e7eb); border-radius:16px; padding:18px; background:#fff; margin-bottom:20px; }
  .tx-chart h3 { font-size:0.95rem; margin:0 0 12px; }
  .tx-chart canvas { width:100% !important; height:240px !important; }
  table.tx { width:100%; border-collapse:collapse; font-size:0.9rem; }
  table.tx th, table.tx td { padding:11px 12px; border-bottom:1px solid var(--border,#eee); text-align:left; white-space:nowrap; }
  table.tx th { background:var(--surface-2,#f8fafc); font-size:0.82rem; color:var(--text-muted); position:sticky; top:0; }
  table.tx td.num { text-align:right; font-variant-numeric:tabular-nums; font-weight:600; }
  .tx-wrap { max-height:520px; overflow:auto; border:1px solid var(--border,#e5e7eb); border-radius:14px; }
  @media (max-width:600px){ table.tx .hide-sm { display:none; } }
</style>
</head>
<body>

<header class="site-header">
  <div class="container row">
    <a href="../index.html" class="brand"><span class="brand-mark"></span>톺다</a>
    <nav class="nav">
      <a href="../guides.html" data-nav>가이드</a>
      <a href="../calculators/index.html" data-nav class="active">계산기</a>
      <a href="../market.html" data-nav>시세정보</a>
      <a href="../checklists/index.html" data-nav>체크리스트</a>
    </nav>
    <button class="nav-toggle" data-nav-toggle aria-label="메뉴 열기">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
  </div>
  <div class="mobile-menu" data-mobile-menu>
    <a href="../guides.html">가이드</a>
    <a href="../calculators/index.html">계산기</a>
    <a href="../market.html">시세정보</a>
    <a href="../checklists/index.html">체크리스트</a>
    <a href="../board.html">게시판</a>
    <a href="../about.html">안내</a>
  </div>
</header>

<main class="container">
  <div class="article-header">
    <div class="breadcrumb"><a href="../index.html">홈</a> / <a href="index.html">계산기</a> / 실거래가 조회</div>
    <h1>실거래가 조회</h1>
    <div class="meta"><span>지역·단지·평형별 최근 매매 거래를 검색하고 그래프로 확인</span></div>
  </div>

  <p class="tx-asof" id="txAsof" style="color:var(--text-muted); font-size:0.85rem; margin: 6px 0 14px;">데이터 기준일 확인 중…</p>

  <div class="tx-controls">
    <div class="tx-field" style="flex:1; min-width:200px;">
      <label for="tx-search">단지명 검색</label>
      <input id="tx-search" type="search" placeholder="예: 헬리오시티, 래미안" autocomplete="off" />
    </div>
    <div class="tx-field"><label for="tx-sido">시·도</label><select id="tx-sido"></select></div>
    <div class="tx-field"><label for="tx-gu">시·군·구</label><select id="tx-gu"></select></div>
    <div class="tx-field"><label for="tx-apt">단지</label><select id="tx-apt"><option value="">전체</option></select></div>
    <div class="tx-field"><label for="tx-area">평형</label>
      <select id="tx-area">
        <option value="all">전체</option>
        <option value="small">소형(~60㎡)</option>
        <option value="ms">국민평형(60~85㎡)</option>
        <option value="mid">중형(85~102㎡)</option>
        <option value="large">대형(102㎡~)</option>
      </select>
    </div>
    <div class="tx-field"><label for="tx-window">최근 기간</label>
      <select id="tx-window">
        <option value="180">6개월</option>
        <option value="90">3개월</option>
        <option value="365">1년</option>
        <option value="0" selected>전체</option>
      </select>
    </div>
  </div>

  <div class="tx-stats" id="txStats"></div>

  <div class="tx-chart" id="txChartBox" style="display:none;">
    <h3 id="txChartTitle">단지 실거래가 추이</h3>
    <canvas id="txChart"></canvas>
  </div>

  <div class="tx-wrap">
    <table class="tx">
      <thead><tr><th>거래일</th><th>단지</th><th>전용(평)</th><th class="num">거래금액</th><th class="hide-sm">층</th><th class="hide-sm">준공</th></tr></thead>
      <tbody id="txBody"></tbody>
    </table>
  </div>
  <p style="color:var(--text-muted); font-size:0.82rem; margin-top:10px;" id="txCount"></p>

  <p style="color: var(--text-muted); font-size: 0.8rem; margin-top: 32px;">국토교통부 실거래가 자료. 신고가 취소·정정 거래가 포함될 수 있어 계약 전 원자료 확인을 권합니다.</p>
</main>

<footer class="site-footer">
  <div class="container"><p class="disclaimer">© 톺다. 일반 정보 제공용입니다.</p></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="../assets/region.js?v=20260611"></script>
<script src="../assets/app.js?v=20260611"></script>
<script>
(function () {
  'use strict';
  var R = window.TopdaRegion;
  var DATA = [], chart = null;
  var searchEl = document.getElementById('tx-search');
  var sidoSel = document.getElementById('tx-sido');
  var guSel = document.getElementById('tx-gu');
  var aptSel = document.getElementById('tx-apt');
  var areaSel = document.getElementById('tx-area');
  var windowSel = document.getElementById('tx-window');
  var body = document.getElementById('txBody');
  var statsEl = document.getElementById('txStats');
  var countEl = document.getElementById('txCount');
  var asofEl = document.getElementById('txAsof');
  var chartBox = document.getElementById('txChartBox');

  function debounce(fn, ms) {
    var t; return function () { clearTimeout(t); var a = arguments, c = this; t = setTimeout(function () { fn.apply(c, a); }, ms); };
  }
  function escapeHtml(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function won(m) { var e = m / 10000; return (Number.isInteger(e) ? e : e.toFixed(1)) + '억'; }
  function areaBand(m2) { return m2 < 60 ? 'small' : m2 < 85 ? 'ms' : m2 < 102 ? 'mid' : 'large'; }
  function daysSince(dateStr) {
    if (!dateStr) return null;
    var d = new Date(dateStr); if (isNaN(d)) return null;
    return Math.floor((Date.now() - d.getTime()) / 86400000);
  }
  function ago(days) {
    if (days == null) return '';
    if (days < 1) return '오늘';
    if (days < 7) return days + '일 전';
    if (days < 30) return Math.floor(days / 7) + '주 전';
    if (days < 365) return Math.floor(days / 30) + '개월 전';
    return Math.floor(days / 365) + '년 전';
  }

  function sidoOf(d) { return R.normSido(d.sido || (d.region_key || '').split(' ')[0] || (d.region || '').split(' ')[0]); }
  function sigunguOf(d) {
    var k = d.region_key || '';
    var parts = k.split(' ');
    return parts.length >= 2 ? parts.slice(1).join(' ') : '';
  }

  function fillSido() {
    var set = {};
    DATA.forEach(function (d) { var s = sidoOf(d); if (s) set[s] = true; });
    R.fillSidoSelect(sidoSel, Object.keys(set));
    if (sidoSel.options.length > 1) sidoSel.value = 'all';
  }
  function fillGu() {
    var sido = sidoSel.value;
    if (!sido || sido === 'all') {
      R.fillSigunguSelect(guSel, [], true);
      return;
    }
    var set = {};
    DATA.forEach(function (d) {
      if (sidoOf(d) === sido) { var g = sigunguOf(d); if (g) set[g] = true; }
    });
    R.fillSigunguSelect(guSel, Object.keys(set), true);
  }
  function fillApts() {
    var sido = sidoSel.value, gu = guSel.value;
    var names = [];
    DATA.forEach(function (d) {
      if (sido !== 'all' && sidoOf(d) !== sido) return;
      if (gu && gu !== 'all' && sigunguOf(d) !== gu) return;
      if (names.indexOf(d.apt) < 0) names.push(d.apt);
    });
    names.sort();
    aptSel.innerHTML = '<option value="">전체</option>' + names.map(function (n) { return '<option value="' + escapeHtml(n) + '">' + escapeHtml(n) + '</option>'; }).join('');
  }

  function filtered() {
    var sido = sidoSel.value, gu = guSel.value, apt = aptSel.value, area = areaSel.value;
    var q = (searchEl.value || '').trim().toLowerCase();
    var winDays = parseInt(windowSel.value, 10) || 0;
    var cutoff = winDays ? new Date(Date.now() - winDays * 86400000).toISOString().slice(0, 10) : '';
    return DATA.filter(function (d) {
      if (sido !== 'all' && sidoOf(d) !== sido) return false;
      if (gu && gu !== 'all' && sigunguOf(d) !== gu) return false;
      if (apt && d.apt !== apt) return false;
      if (area !== 'all' && areaBand(d.area_m2) !== area) return false;
      if (cutoff && d.date < cutoff) return false;
      if (q) {
        var hay = (d.apt + ' ' + (d.region || '') + ' ' + (d.region_key || '')).toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    });
  }

  function renderStats(list) {
    var n = list.length;
    var sorted = list.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    var recent = sorted[0] ? won(sorted[0].price) + ' · ' + sorted[0].date + ' (' + ago(daysSince(sorted[0].date)) + ')' : '—';
    var avg = n ? won(Math.round(list.reduce(function (a, b) { return a + b.price; }, 0) / n)) : '—';
    var hi = n ? won(Math.max.apply(null, list.map(function (d) { return d.price; }))) : '—';
    var cards = [['거래 건수', n.toLocaleString() + '건'], ['최근 실거래', recent], ['평균가', avg], ['최고가', hi]];
    statsEl.innerHTML = cards.map(function (c) { return '<div class="tx-stat"><div class="lbl">' + c[0] + '</div><div class="num">' + c[1] + '</div></div>'; }).join('');
  }

  function renderChart(list) {
    if (aptSel.value && list.length > 1) {
      chartBox.style.display = '';
      document.getElementById('txChartTitle').textContent = aptSel.value + ' 실거래가 추이';
      var pts = list.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; })
        .map(function (d) { return { x: d.date, y: d.price / 10000 }; });
      if (chart) chart.destroy();
      chart = new Chart(document.getElementById('txChart').getContext('2d'), {
        type: 'line',
        data: { datasets: [{ label: '실거래가(억)', data: pts, borderColor: '#2563eb', backgroundColor: 'rgba(37,99,235,0.08)', fill: true, tension: 0.2, pointRadius: 3 }] },
        options: { responsive: true, maintainAspectRatio: false, parsing: false,
          plugins: { legend: { display: false } },
          scales: { x: { type: 'category', labels: pts.map(function (p) { return p.x; }) }, y: { ticks: { callback: function (v) { return v + '억'; } } } } },
      });
    } else {
      chartBox.style.display = 'none';
    }
  }

  function render() {
    var list = filtered();
    list.sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    renderStats(list);
    renderChart(list);
    body.innerHTML = list.slice(0, 300).map(function (d) {
      var aptUrl = 'search.html?apt=' + encodeURIComponent(d.apt);
      var when = ago(daysSince(d.date));
      return '<tr><td>' + d.date + ' <span style="color:var(--text-muted); font-size:0.78rem;">(' + when + ')</span></td>' +
        '<td><a class="tx-link" href="' + aptUrl + '" title="이 단지를 맞춤찾기에서 보기">' + escapeHtml(d.apt) + '</a></td>' +
        '<td>' + d.area_m2 + '㎡(' + d.pyeong + ')</td>' +
        '<td class="num">' + won(d.price) + '</td><td class="hide-sm">' + d.floor + '층</td><td class="hide-sm">' + (d.build_year || '—') + '</td></tr>';
    }).join('');
    countEl.textContent = list.length.toLocaleString() + '건 중 최근 ' + Math.min(300, list.length).toLocaleString() + '건 표시';
  }

  searchEl.addEventListener('input', debounce(render, 200));
  sidoSel.addEventListener('change', function () { fillGu(); fillApts(); render(); });
  guSel.addEventListener('change', function () { fillApts(); render(); });
  aptSel.addEventListener('change', render);
  areaSel.addEventListener('change', render);
  windowSel.addEventListener('change', render);

  fetch('../assets/transactions.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('load'); return r.json(); })
    .then(function (j) {
      DATA = j.deals || [];
      // 최신 거래일 표시
      var latest = '';
      for (var i = 0; i < DATA.length; i++) if (DATA[i].date > latest) latest = DATA[i].date;
      if (asofEl) {
        var d = daysSince(latest);
        asofEl.innerHTML = '실거래 최신 갱신 <strong>' + (latest || '—') + '</strong>' + (d != null ? ' (' + ago(d) + ')' : '') + ' · 총 ' + DATA.length.toLocaleString() + '건';
      }
      fillSido();
      fillGu();
      fillApts();
      render();
    })
    .catch(function () {
      statsEl.innerHTML = '<div class="tx-stat">데이터를 불러오지 못했습니다. 잠시 후 다시 시도해주세요.</div>';
      if (asofEl) asofEl.textContent = '';
    });
})();
</script>
</body>
</html>
