<style>
  .tx-controls { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin-bottom:20px; }
  .tx-field label { display:block; font-size:0.82rem; font-weight:600; margin-bottom:6px; color:var(--text-muted); }
  .tx-field select, .tx-field input { padding:10px 12px; border:1px solid var(--border,#d1d5db); border-radius:10px; font-size:0.95rem; font-family:inherit; background:#fff; min-width:150px; width:100%; box-sizing:border-box; }
  .tx-link { color:var(--accent,#2563eb); text-decoration:none; font-weight:600; }
  .tx-link:hover { text-decoration:underline; }
  .tx-stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:20px; }
  .tx-stat { border:1px solid var(--border,#e5e7eb); border-radius:14px; padding:14px 16px; background:#fff; }
  .tx-stat .lbl { font-size:0.78rem; color:var(--text-muted); }
  .tx-stat .num { font-size:1.4rem; font-weight:800; margin-top:4px; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; }
  .tx-chart { border:1px solid var(--border,#e5e7eb); border-radius:16px; padding:18px; background:#fff; margin-bottom:20px; }
  .tx-chart h3 { font-size:0.95rem; margin:0 0 12px; }
  .tx-chart canvas { width:100% !important; height:240px !important; }
  table.tx { width:100%; border-collapse:collapse; font-size:0.9rem; }
  table.tx th, table.tx td { padding:11px 12px; border-bottom:1px solid var(--border,#eee); text-align:left; white-space:nowrap; }
  table.tx th { background:var(--surface-2,#f8fafc); font-size:0.82rem; color:var(--text-muted); position:sticky; top:0; }
  table.tx td.num { text-align:right; font-variant-numeric:tabular-nums; font-weight:600; }
  .tx-wrap { max-height:520px; overflow:auto; border:1px solid var(--border,#e5e7eb); border-radius:14px; }
  table.tx tbody tr { cursor: pointer; transition: background 0.12s; }
  table.tx tbody tr:hover { background: var(--accent-soft, #eff6ff); }
  @media (max-width:600px){ table.tx .hide-sm { display:none; } }

  /* 단지 상세 모달 */
  .tx-modal { position:fixed; inset:0; display:none; z-index:1000; }
  .tx-modal.open { display:block; }
  .tx-modal-backdrop { position:absolute; inset:0; background:rgba(15,23,42,0.5); }
  .tx-modal-panel {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:min(720px, calc(100vw - 32px)); max-height:90vh; overflow:auto;
    background:#fff; border-radius:18px; padding:24px;
    box-shadow: 0 20px 60px -16px rgba(15,23,42,0.4);
  }
  .tx-modal-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:16px; }
  .tx-modal-head h2 { margin:0; font-size:1.25rem; letter-spacing:-0.02em; }
  .tx-modal-sub { margin:4px 0 0; color:var(--text-muted); font-size:0.88rem; }
  .tx-modal-close { background:none; border:0; padding:4px; cursor:pointer; color:var(--text-muted); }
  .tx-modal-close:hover { color:var(--text); }
  .tx-modal-meta { display:grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap:10px; margin-bottom:18px; }
  .tx-modal-meta .item { background:var(--surface-2, #f8fafc); border-radius:10px; padding:10px 12px; }
  .tx-modal-meta .lbl { font-size:0.74rem; color:var(--text-muted); }
  .tx-modal-meta .val { font-size:1.05rem; font-weight:700; margin-top:2px; font-variant-numeric:tabular-nums; }
  .tx-modal-chart { margin-bottom:18px; }
  .tx-modal-chart h3, .tx-modal-list h3 { font-size:0.95rem; margin:0 0 10px; }
  .tx-modal-chart canvas { width:100% !important; height:200px !important; }
</style>

      <input id="tx-search" type="search" placeholder="단지명 또는 지역을 검색하세요 (예: 헬리오시티, 강남구)" autocomplete="off" />
    </div>
    <div class="tx-field"><label for="tx-sido">시·도</label><select id="tx-sido"></select></div>

    <div class="tx-field"><label for="tx-area">평형</label>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="../assets/region.js?v=20260613"></script>
<script src="../assets/app.js?v=20260613"></script>
<script>
(function () {
  'use strict';
  var R = window.TopdaRegion;
  var DATA = [], APARTMENTS = {}, modalChart = null;
  var searchEl = document.getElementById('tx-search');
  var sidoSel = document.getElementById('tx-sido');
  var guSel = document.getElementById('tx-gu');
  var areaSel = document.getElementById('tx-area');
  var windowSel = document.getElementById('tx-window');
  var body = document.getElementById('txBody');
  var countEl = document.getElementById('txCount');
  var asofEl = document.getElementById('txAsof');
  var modal = document.getElementById('txModal');

  function debounce(fn, ms) {
    var t; return function () { clearTimeout(t); var a = arguments, c = this; t = setTimeout(function () { fn.apply(c, a); }, ms); };
  }
  function escapeHtml(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function won(m) { var e = m / 10000; return (Number.isInteger(e) ? e : e.toFixed(1)) + '억'; }
  function areaBand(m2) { return m2 < 60 ? 'small' : m2 < 85 ? 'ms' : m2 < 102 ? 'mid' : 'large'; }
  function daysSince(dateStr) {
    if (!dateStr) return null;
    var d = new Date(dateStr); if (isNaN(d)) return null;
    return Math.floor((Date.now() - d.getTime()) / 86400000);
  }
  function ago(days) {
    if (days == null) return '';
    if (days < 1) return '오늘';
    if (days < 7) return days + '일 전';
    if (days < 30) return Math.floor(days / 7) + '주 전';
    if (days < 365) return Math.floor(days / 30) + '개월 전';
    return Math.floor(days / 365) + '년 전';
  }

  function sidoOf(d) { return R.normSido(d.sido || (d.region_key || '').split(' ')[0] || (d.region || '').split(' ')[0]); }
  function sigunguOf(d) {
    var k = d.region_key || '';
    var parts = k.split(' ');
    return parts.length >= 2 ? parts.slice(1).join(' ') : '';
  }

  function fillSido() {
    var set = {};
    DATA.forEach(function (d) { var s = sidoOf(d); if (s) set[s] = true; });
    R.fillSidoSelect(sidoSel, Object.keys(set));
    if (sidoSel.options.length > 1) sidoSel.value = 'all';
  }
  function fillGu() {
    var sido = sidoSel.value;
    if (!sido || sido === 'all') {
      R.fillSigunguSelect(guSel, [], true);
      return;
    }
    var set = {};
    DATA.forEach(function (d) {
      if (sidoOf(d) === sido) { var g = sigunguOf(d); if (g) set[g] = true; }
    });
    R.fillSigunguSelect(guSel, Object.keys(set), true);
  }

  function filtered() {
    var sido = sidoSel.value, gu = guSel.value, area = areaSel.value;
    var q = (searchEl.value || '').trim().toLowerCase();
    var winDays = parseInt(windowSel.value, 10) || 0;
    var cutoff = winDays ? new Date(Date.now() - winDays * 86400000).toISOString().slice(0, 10) : '';
    return DATA.filter(function (d) {
      if (sido !== 'all' && sidoOf(d) !== sido) return false;
      if (gu && gu !== 'all' && sigunguOf(d) !== gu) return false;
      if (area !== 'all' && areaBand(d.area_m2) !== area) return false;
      if (cutoff && d.date < cutoff) return false;
      if (q) {
        var hay = (d.apt + ' ' + (d.region || '') + ' ' + (d.region_key || '')).toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    });
  }

  function render() {
    var list = filtered();
    list.sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    var top = list.slice(0, 500);   // 표시량 200 → 500 (검색 대상 확대)
    body.innerHTML = top.map(function (d) {
      var when = ago(daysSince(d.date));
      var aptName = escapeHtml(d.apt);
      return '<tr data-apt="' + aptName + '">' +
        '<td>' + d.date + ' <span style="color:var(--text-muted); font-size:0.78rem;">(' + when + ')</span></td>' +
        '<td><span class="tx-link">' + aptName + '</span></td>' +
        '<td>' + d.area_m2 + '㎡(' + d.pyeong + ')</td>' +
        '<td class="num">' + won(d.price) + '</td>' +
        '<td class="hide-sm">' + d.floor + '층</td>' +
        '<td class="hide-sm">' + (d.build_year || '—') + '</td></tr>';
    }).join('');
    countEl.textContent = list.length.toLocaleString() + '건 중 ' + top.length.toLocaleString() + '건 표시';
  }

  // ── 단지 상세 모달 ─────────────────────────────────────
  function openModal(aptName) {
    var deals = DATA.filter(function (d) { return d.apt === aptName; })
      .sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    if (!deals.length) return;
    var first = deals[0], last = deals[deals.length - 1];
    var apt = APARTMENTS[aptName] || {};
    document.getElementById('txModalTitle').textContent = aptName;
    document.getElementById('txModalSub').textContent = (last.region || first.region || apt.region || '');

    // 메타 정보
    var prices = deals.map(function (d) { return d.price; });
    var avg = Math.round(prices.reduce(function (a, b) { return a + b; }, 0) / prices.length);
    var hi = Math.max.apply(null, prices);
    var lo = Math.min.apply(null, prices);
    var built = last.build_year || apt.built_year;
    var meta = [
      { lbl: '최근 거래', val: won(last.price) + ' · ' + last.date + ' (' + ago(daysSince(last.date)) + ')' },
      { lbl: '거래 건수', val: deals.length.toLocaleString() + '건' },
      { lbl: '평균가', val: won(avg) },
      { lbl: '최고가', val: won(hi) },
      { lbl: '최저가', val: won(lo) },
    ];
    if (built) meta.push({ lbl: '준공', val: built + '년' });
    if (apt.households) meta.push({ lbl: '세대수', val: apt.households.toLocaleString() + '세대' });
    if (apt.subway && apt.subway.station) meta.push({ lbl: '가까운 역', val: apt.subway.station + ' ' + apt.subway.distance_m + 'm' });
    if (apt.elementary && apt.elementary.name) meta.push({ lbl: '초등학교', val: apt.elementary.name + ' ' + apt.elementary.distance_m + 'm' });
    document.getElementById('txModalMeta').innerHTML = meta.map(function (m) {
      return '<div class="item"><div class="lbl">' + escapeHtml(m.lbl) + '</div><div class="val">' + escapeHtml(m.val) + '</div></div>';
    }).join('');

    // 추이 차트 — 월별 평균으로 집계해 점이 균등 간격으로 찍히게 한다.
    // (일자 단위로 찍으면 거래일 사이 빈 일자가 노출돼 시각적으로 '뚝뚝' 끊겨 보임)
    var monthly = {};
    deals.forEach(function (d) {
      var mo = (d.date || '').slice(0, 7); if (!mo) return;
      if (!monthly[mo]) monthly[mo] = { sum: 0, n: 0, lo: Infinity, hi: 0 };
      monthly[mo].sum += d.price; monthly[mo].n += 1;
      if (d.price < monthly[mo].lo) monthly[mo].lo = d.price;
      if (d.price > monthly[mo].hi) monthly[mo].hi = d.price;
    });
    var months = Object.keys(monthly).sort();
    // 빈 월도 채워 라인 끊김 방지 (월 간격이 비어 있어도 보간)
    function fillMonths(arr) {
      if (arr.length < 2) return arr;
      var out = [arr[0]];
      for (var i = 1; i < arr.length; i++) {
        var prev = arr[i - 1], cur = arr[i];
        var py = +prev.slice(0, 4), pm = +prev.slice(5, 7);
        var cy = +cur.slice(0, 4), cm = +cur.slice(5, 7);
        var totalMonths = (cy - py) * 12 + (cm - pm);
        for (var k = 1; k < totalMonths; k++) {
          pm += 1; if (pm > 12) { pm = 1; py += 1; }
          out.push(String(py) + '-' + (pm < 10 ? '0' + pm : '' + pm));
        }
        out.push(cur);
      }
      return out;
    }
    var allMonths = fillMonths(months);
    var avgSeries = allMonths.map(function (mo) { return monthly[mo] ? Math.round(monthly[mo].sum / monthly[mo].n / 10000 * 10) / 10 : null; });
    if (modalChart) modalChart.destroy();
    modalChart = new Chart(document.getElementById('txModalChart').getContext('2d'), {
      type: 'line',
      data: {
        labels: allMonths,
        datasets: [{
          label: '월평균 실거래가(억)', data: avgSeries,
          borderColor: '#2563eb', backgroundColor: 'rgba(37,99,235,0.10)',
          fill: true, tension: 0.25, pointRadius: 3, spanGaps: true,
        }],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: function (ctx) {
          var mo = ctx.label, m = monthly[mo];
          if (!m) return mo + ' 거래 없음';
          var avg = won(Math.round(m.sum / m.n));
          return mo + ' · 평균 ' + avg + ' · 건수 ' + m.n + (m.lo !== m.hi ? ' (' + won(m.lo) + '~' + won(m.hi) + ')' : '');
        } } } },
        scales: { x: { grid: { display: false } }, y: { ticks: { callback: function (v) { return v + '억'; } } } },
      },
    });

    // 거래 내역 리스트 (최신 → 과거)
    var listHtml = deals.slice().reverse().map(function (d) {
      return '<tr><td>' + d.date + '</td><td>' + d.area_m2 + '㎡(' + d.pyeong + ')</td>' +
        '<td class="num">' + won(d.price) + '</td><td class="hide-sm">' + d.floor + '층</td></tr>';
    }).join('');
    document.getElementById('txModalBody').innerHTML = listHtml;

    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }
  function closeModal() {
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }
  body.addEventListener('click', function (e) {
    var tr = e.target.closest('tr[data-apt]'); if (!tr) return;
    openModal(tr.dataset.apt);
  });
  document.querySelectorAll('[data-tx-close]').forEach(function (b) { b.addEventListener('click', closeModal); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && modal.classList.contains('open')) closeModal(); });

  searchEl.addEventListener('input', debounce(render, 200));
  sidoSel.addEventListener('change', function () { fillGu(); render(); });
  guSel.addEventListener('change', render);
  areaSel.addEventListener('change', render);
  windowSel.addEventListener('change', render);

  // 데이터 로드: transactions + apartments(보강용)
  Promise.all([
    fetch('../assets/transactions.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : { deals: [] }; }).catch(function () { return { deals: [] }; }),
    fetch('../assets/apartments.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : { apartments: [] }; }).catch(function () { return { apartments: [] }; }),
  ]).then(function (results) {
    DATA = results[0].deals || [];
    (results[1].apartments || []).forEach(function (a) { APARTMENTS[a.name] = a; });
    var latest = '';
    for (var i = 0; i < DATA.length; i++) if (DATA[i].date > latest) latest = DATA[i].date;
    if (asofEl) {
      var d = daysSince(latest);
      asofEl.innerHTML = '실거래 최신 갱신 <strong>' + (latest || '—') + '</strong>' + (d != null ? ' (' + ago(d) + ')' : '') + ' · 총 ' + DATA.length.toLocaleString() + '건';
    }
    fillSido();
    fillGu();
    render();
  });
})();
</script>
</body>
