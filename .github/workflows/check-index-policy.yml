name: Check index & ads policy

# 색인·광고·신뢰 정책 검증 (_meta/check_index_policy.py).
#
# 왜 CI 에서 도는가: noindex·sitemap·canonical·hreflang·광고 범위는 서로 맞물려 있어
# 한 곳만 고치면 조용히 어긋난다(예: 페이지를 noindex 로 바꿨는데 sitemap 에 남아 있는 상태).
# 사람이 매번 확인할 수 없으므로 PR 단계에서 기계가 막는다.
#
# ⚠ 단지 페이지(site/apt/*/*/)는 저장소에 커밋하지 않으므로, 검증 전에 생성해야
# 아파트 색인 품질 게이트까지 실제로 검사된다. 생성 없이 돌리면 그 검사만 건너뛴다.

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "site/**"
      - "_meta/**"
      - ".github/workflows/check-index-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 단지 페이지 생성 — 배포(deploy-pages.yml)와 같은 명령을 쓴다.
      # 실패해도 계속 진행한다: 생성이 안 되면 apt 게이트 검사만 건너뛰고 나머지는 그대로 본다.
      # (배포 워크플로에서는 반대로 실패시켜야 한다 — 거기서는 페이지 누락이 곧 사이트 손상이다.)
      - name: Build complex pages
        continue-on-error: true
        working-directory: _meta
        run: python build_complex_pages.py --all

      - name: 홈 핵심 이슈 데이터 검증
        working-directory: _meta
        run: python build_home_issues.py --check

      - name: 색인·광고·신뢰 정책 검증
        working-directory: _meta
        run: python check_index_policy.py

      # 감사 인벤토리는 검증이 아니라 현황 보고다. 실패시키지 않고 요약만 로그에 남긴다.
      - name: 콘텐츠 인벤토리 요약
        if: always()
        working-directory: _meta
        run: python audit_content.py --summary
