name: Check index & ads policy

# 색인·광고·신뢰 정책 검증 (_meta/check_index_policy.py).
#
# 왜 CI 에서 도는가: noindex·sitemap·canonical·hreflang·광고 범위는 서로 맞물려 있어
# 한 곳만 고치면 조용히 어긋난다(예: 페이지를 noindex 로 바꿨는데 sitemap 에 남아 있는 상태).
# 사람이 매번 확인할 수 없으므로 PR 단계에서 기계가 막는다.
#
# 단지별 대량 정적 페이지는 만들지 않는다. 검증은 지역 URL만 sitemap에 있는지,
# 레거시 별칭이 noindex 리다이렉트인지, 단지별 HTML이 다시 생기지 않았는지 확인한다.

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "site/**"
      - "_meta/**"
      - ".github/workflows/check-index-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build canonical region pages
        working-directory: _meta
        run: python build_apt_pages.py

      - name: Retire legacy region aliases
        working-directory: _meta
        run: python retire_apt_aliases.py

      - name: Rebuild sitemaps
        working-directory: _meta
        run: python build_sitemaps.py

      - name: 홈 핵심 이슈 데이터 검증
        working-directory: _meta
        run: python build_home_issues.py --check

      # RSS 는 손으로 관리하다 본문 정비와 어긋난 전력이 있다(2026-08-08 감사: 32건 중
      # 21건 불일치, 정비가 걷어낸 과장 표현이 RSS 에만 남아 있었다). 생성기를 둔 이상
      # 어긋난 채 머지되지 않도록 여기서 막는다.
      - name: RSS 가 본문과 일치하는지 검증
        working-directory: _meta
        run: python build_feed.py --check

      - name: 색인·광고·신뢰 정책 검증
        working-directory: _meta
        run: python check_index_policy.py

      # calc_meta.json 의 작성 대기 슬롯은 build_calc_meta.py 가 화면에서 걸러내므로
      # 정상 경로로는 배포본에 나갈 수 없다. 사람이 HTML 에 직접 써 넣은 경우만 남는데,
      # 그건 "TODO(작성필요)" 가 본문에 그대로 보이는 상태다 — 재심사 중에는 빈
      # 자리표시자가 아무것도 없는 것보다 나쁘므로 여기서 막는다.
      - name: 자리표시자가 배포본에 남아 있지 않은지 검증
        run: |
          if grep -rl 'TODO(작성필요)' site/; then
            echo "::error::위 파일의 본문에 자리표시자가 남아 있습니다. calc_meta.json 에 문장을 채우거나 해당 문구를 지우세요."
            exit 1
          fi
          echo "배포본에 자리표시자 없음"

      # 감사 인벤토리는 검증이 아니라 현황 보고다. 실패시키지 않고 요약만 로그에 남긴다.
      - name: 콘텐츠 인벤토리 요약
        if: always()
        working-directory: _meta
        run: python audit_content.py --summary
