name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
  # 매일 한 번, 수집 워크플로가 모두 끝난 뒤 배포한다.
  #
  # ■ 왜 필요한가 (2026-08-05 발견)
  #
  #   수집 워크플로(refresh-*)는 결과를 main 에 커밋·푸시하지만, 그 푸시는 기본
  #   GITHUB_TOKEN 으로 이뤄진다. GitHub 은 재귀 실행을 막으려고 **GITHUB_TOKEN 으로
  #   만든 push 로는 다른 워크플로를 트리거하지 않는다.** 그래서 위 `on: push` 가
  #   일일 데이터 커밋에는 걸리지 않았다.
  #
  #   실제로 배포 실행 30건이 전부 PR 머지(사람이 만든 push)나 수동 실행이었다.
  #   즉 매일 모으는 실거래·공시가격·채권 할인율이 **다음 PR 이 머지될 때까지
  #   사이트에 반영되지 않았다.** 채권 할인율은 2026-08-05 17:04 UTC 에 실측값
  #   15.0251% 를 수집해 main 에 커밋했는데도 화면에는 예시값이 그대로였다.
  #
  # ■ 시각을 18:30 UTC 로 두는 이유
  #
  #   수집은 15:00·15:10·15:30·15:45 UTC 에 걸려 있지만 GitHub 스케줄은 밀린다
  #   (실측 16:26~17:21 착수). 공시가격 수집은 최대 55분을 쓴다. 넉넉히 뒤에 둔다.
  schedule:
    - cron: "30 18 * * *"   # 매일 03:30 KST — 수집(00:00~00:45 KST) 완료 후
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 단지 페이지(site/apt/{지역}/{단지}/index.html)는 저장소에 커밋하지 않는다.
      # 4,500개 이상이 매일 데이터 갱신과 함께 통째로 재생성되기 때문에, 커밋하면
      # git 이력이 하루 5MB씩(연 1.8GB) 늘어난다. 대신 배포할 때마다 여기서 만든다.
      # 생성은 11초면 끝나고, 읽는 데이터(transactions/households)와 슬러그 대장
      # (data/slug-map.json)은 모두 커밋돼 있어 URL은 실행마다 동일하다.
      #
      # 순서 주의: 반드시 Kakao 키 주입보다 **먼저** 와야 한다. 나중에 오면 방금 만든
      # 페이지에는 플레이스홀더가 그대로 남는다.
      # ⚠ continue-on-error를 쓰지 않는다. 다른 수집 워크플로에서는 한 스텝이 실패해도
      # 앞 산출물을 지키려고 계속 진행하지만, 여기서는 정반대다. 페이지가 커밋돼 있지
      # 않으므로 생성이 실패한 채 배포가 이어지면 단지 페이지 4,500여 개가 통째로 빠진
      # 사이트가 그대로 올라간다 — 그것도 '배포 성공'으로 보이면서. 여기서 실패시키면
      # 배포가 중단되고 GitHub Pages는 직전 배포본을 그대로 서비스하므로, 살아 있는
      # 사이트는 멀쩡한 채로 알림만 받는다. 그게 옳은 실패 방향이다.
      - name: Build complex pages (커밋하지 않는 SEO 페이지)
        working-directory: _meta
        timeout-minutes: 10
        run: python build_complex_pages.py --all

      # 생성기가 0을 반환하고도 페이지를 거의 못 만드는 경우(데이터 파일 파손 등)를 잡는다.
      # 배포 후에 알아차리면 이미 검색 노출이 빠진 뒤다.
      - name: Verify complex pages exist
        run: |
          MIN=1000
          N=$(find site/apt -mindepth 3 -name index.html | wc -l)
          echo "생성된 단지 페이지: ${N}개 (최소 기대치 ${MIN})"
          if [ "$N" -lt "$MIN" ]; then
            echo "::error::단지 페이지가 ${N}개뿐입니다. 생성이 정상적으로 끝나지 않았을 수 있어 배포를 중단합니다."
            exit 1
          fi

      # 단지 페이지를 방금 다시 만들었으므로 sitemap 도 그 결과에 맞춰 다시 만든다.
      # 이것을 빼면, 데이터가 바뀌어 색인 품질 게이트 통과 단지가 달라졌는데도 배포본의
      # sitemap 은 커밋 당시 목록을 그대로 실어, noindex 페이지를 sitemap 에 올리는
      # 모순된 신호를 보내게 된다. build_complex_pages 가 sitemap-all.xml(평면 목록)을
      # 갱신하고, 이 스텝이 그것을 분류별 sitemap + sitemap index 로 쪼갠다.
      # ⚠ 배포본만 고치는 것이고 저장소에 커밋하지 않는다(단지 페이지와 같은 취급).
      - name: Rebuild sitemaps (색인 허용 URL만)
        working-directory: _meta
        run: python build_sitemaps.py

      # sitemap-all.xml 은 생성기들이 공유하는 내부 평면 목록이다. noindex URL 까지 담고
      # 있어서 그대로 배포하면 공개 sitemap 처럼 접근된다(robots.txt 가 가리키지는 않지만
      # 주소를 알면 열린다). 저장소에는 남기고 배포본에서만 뺀다.
      - name: Drop internal flat sitemap from artifact
        run: rm -f site/sitemap-all.xml

      - name: Inject Kakao JavaScript key
        env:
          KAKAO_JS_KEY: ${{ secrets.KAKAO_JAVASCRIPT_KEY }}
        run: |
          # Kakao 지도 JS 키는 도메인 제한형이라 배포본 노출이 정상.
          # __KAKAO_JS_KEY__ 플레이스홀더를 secret 값으로 치환(미설정 시 폴백 지도 유지).
          #
          # 견고화(2026-07-17): GitHub Secrets UI에 값을 붙여넣을 때 트레일링
          # 개행·공백이 함께 들어가는 실수가 흔하다. 그 상태로 그대로 sed 치환하면
          # JS 문자열 리터럴 안에 실제 개행이 섞여 `var KAKAO_KEY = '...\n';`처럼
          # 문법 오류가 나고, <script> 블록 전체가 죽어 Leaflet 폴백조차 못 탄다
          # ("키를 분명히 넣었는데 지도가 아예 안 뜬다"의 유력 원인). 주입 전
          # 공백류를 전부 제거하고, sed 치환자에 특수문자(/,&,\)가 섞여도
          # 안전하도록 이스케이프한다.
          KAKAO_JS_KEY="$(printf '%s' "$KAKAO_JS_KEY" | tr -d '[:space:]')"
          if [ -n "$KAKAO_JS_KEY" ]; then
            ESCAPED="$(printf '%s\n' "$KAKAO_JS_KEY" | sed -e 's/[\/&]/\\&/g')"
            grep -rl "__KAKAO_JS_KEY__" site | while read -r f; do
              sed -i "s/__KAKAO_JS_KEY__/${ESCAPED}/g" "$f"
            done
            echo "Kakao JS key injected into site/ (길이=${#KAKAO_JS_KEY})"
          else
            echo "KAKAO_JAVASCRIPT_KEY 미설정 — 주입 생략(Leaflet 폴백 사용)"
          fi

      - name: Inject Supabase config (게시판 공개글 공유 백엔드)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # anon key는 공개(anon) 키로 설계된 값이라 배포본 노출이 정상이며,
          # 실제 접근 제어는 Supabase RLS 정책이 담당한다(_meta/SUPABASE_SETUP.md 참고).
          # 트레일링 개행·공백 방지는 Kakao 키 주입과 동일한 이유로 필요하다.
          SUPABASE_URL="$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]')"
          SUPABASE_ANON_KEY="$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '[:space:]')"
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            ESC_URL="$(printf '%s\n' "$SUPABASE_URL" | sed -e 's/[\/&]/\\&/g')"
            ESC_KEY="$(printf '%s\n' "$SUPABASE_ANON_KEY" | sed -e 's/[\/&]/\\&/g')"
            grep -rl "__SUPABASE_URL__\|__SUPABASE_ANON_KEY__" site | while read -r f; do
              sed -i "s/__SUPABASE_URL__/${ESC_URL}/g; s/__SUPABASE_ANON_KEY__/${ESC_KEY}/g" "$f"
            done
            echo "Supabase 설정 주입됨 (게시판 공개글 — 모든 방문자에게 공유됨)"
          else
            echo "SUPABASE_URL/SUPABASE_ANON_KEY 미설정 — 게시판은 로컬(localStorage) 전용으로 동작"
          fi

      # 실거래 시·도 조각 + 데이터 상태 요약본. 단지 페이지와 같이 커밋하지 않고 여기서 만든다.
      #
      # ■ 왜 (2026-08-08 감사)
      #   /calculators/transactions.html 은 색인되고 AdSense 가 붙은 페이지인데, 전국 원장
      #   (56MB·gzip 7.0MB, 거래 297,890건)을 `?t=Date.now()` + `cache:'no-store'` 로
      #   **매 방문마다** 통째로 받고 있었다. 사용자가 실제로 보는 것은 시·군·구 하나다.
      #   /market.html(+i18n 5벌)은 최신 거래일 한 줄을 표시하려고 같은 7MB를 받았다.
      #
      # ■ 순서 주의
      #   Kakao·Supabase 주입 뒤에 둔다. 그 스텝들은 `grep -r ... site` 로 전체를 훑는데,
      #   조각(합계 56MB)을 먼저 만들면 훑을 대상이 두 배가 된다. 조각에는 치환할
      #   플레이스홀더가 없으므로 뒤에 와도 안전하다.
      #
      # ⚠ continue-on-error 를 쓰지 않는다. 이 단계가 깨진다는 것은 원장 자체가 읽히지
      #   않는다는 뜻이고, 그러면 클라이언트 폴백(원장 직접 읽기)도 정상 동작할 수 없다.
      #   여기서 실패시키면 배포가 멈추고 GitHub Pages 는 직전 배포본을 그대로 서비스한다.
      - name: Build transaction shards (커밋하지 않는 데이터 조각)
        working-directory: _meta
        run: python build_tx_shards.py

      - name: Verify shards exist
        run: |
          test -f site/assets/tx/manifest.json || { echo "::error::tx/manifest.json 이 없습니다"; exit 1; }
          test -f site/assets/data_status.json || { echo "::error::data_status.json 이 없습니다"; exit 1; }
          N=$(ls site/assets/tx/*.json | wc -l)
          echo "시·도 조각 파일 ${N}개 (manifest 포함)"
          [ "$N" -ge 2 ] || { echo "::error::조각이 ${N}개뿐입니다"; exit 1; }

      - name: Setup Pages
        # enablement: true → Pages 사이트가 없으면 워크플로가 직접 생성·활성화한다.
        # (레포를 private↔public 토글하면 Pages 설정이 사라져 "Get Pages site failed"로
        #  배포가 실패하는데, 이 옵션이 그 사이트를 자동으로 다시 만들어 복구한다.)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
