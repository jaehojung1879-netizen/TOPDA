name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Kakao JavaScript key
        env:
          KAKAO_JS_KEY: ${{ secrets.KAKAO_JAVASCRIPT_KEY }}
        run: |
          # Kakao 지도 JS 키는 도메인 제한형이라 배포본 노출이 정상.
          # __KAKAO_JS_KEY__ 플레이스홀더를 secret 값으로 치환(미설정 시 폴백 지도 유지).
          #
          # 견고화(2026-07-17): GitHub Secrets UI에 값을 붙여넣을 때 트레일링
          # 개행·공백이 함께 들어가는 실수가 흔하다. 그 상태로 그대로 sed 치환하면
          # JS 문자열 리터럴 안에 실제 개행이 섞여 `var KAKAO_KEY = '...\n';`처럼
          # 문법 오류가 나고, <script> 블록 전체가 죽어 Leaflet 폴백조차 못 탄다
          # ("키를 분명히 넣었는데 지도가 아예 안 뜬다"의 유력 원인). 주입 전
          # 공백류를 전부 제거하고, sed 치환자에 특수문자(/,&,\)가 섞여도
          # 안전하도록 이스케이프한다.
          KAKAO_JS_KEY="$(printf '%s' "$KAKAO_JS_KEY" | tr -d '[:space:]')"
          if [ -n "$KAKAO_JS_KEY" ]; then
            ESCAPED="$(printf '%s\n' "$KAKAO_JS_KEY" | sed -e 's/[\/&]/\\&/g')"
            grep -rl "__KAKAO_JS_KEY__" site | while read -r f; do
              sed -i "s/__KAKAO_JS_KEY__/${ESCAPED}/g" "$f"
            done
            echo "Kakao JS key injected into site/ (길이=${#KAKAO_JS_KEY})"
          else
            echo "KAKAO_JAVASCRIPT_KEY 미설정 — 주입 생략(Leaflet 폴백 사용)"
          fi

      - name: Inject Supabase config (게시판 공개글 공유 백엔드)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # anon key는 공개(anon) 키로 설계된 값이라 배포본 노출이 정상이며,
          # 실제 접근 제어는 Supabase RLS 정책이 담당한다(_meta/SUPABASE_SETUP.md 참고).
          # 트레일링 개행·공백 방지는 Kakao 키 주입과 동일한 이유로 필요하다.
          SUPABASE_URL="$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]')"
          SUPABASE_ANON_KEY="$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '[:space:]')"
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            ESC_URL="$(printf '%s\n' "$SUPABASE_URL" | sed -e 's/[\/&]/\\&/g')"
            ESC_KEY="$(printf '%s\n' "$SUPABASE_ANON_KEY" | sed -e 's/[\/&]/\\&/g')"
            grep -rl "__SUPABASE_URL__\|__SUPABASE_ANON_KEY__" site | while read -r f; do
              sed -i "s/__SUPABASE_URL__/${ESC_URL}/g; s/__SUPABASE_ANON_KEY__/${ESC_KEY}/g" "$f"
            done
            echo "Supabase 설정 주입됨 (게시판 공개글 — 모든 방문자에게 공유됨)"
          else
            echo "SUPABASE_URL/SUPABASE_ANON_KEY 미설정 — 게시판은 로컬(localStorage) 전용으로 동작"
          fi

      - name: Setup Pages
        # enablement: true → Pages 사이트가 없으면 워크플로가 직접 생성·활성화한다.
        # (레포를 private↔public 토글하면 Pages 설정이 사라져 "Get Pages site failed"로
        #  배포가 실패하는데, 이 옵션이 그 사이트를 자동으로 다시 만들어 복구한다.)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
