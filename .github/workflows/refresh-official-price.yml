name: Refresh official price (공동주택 공시가격)

# 단지 공동주택가격(시가표준액)을 점진 보강 → site/assets/official_price.json.
# 공식 오픈API가 없어 Kakao(주소→PNU) + V-World(PNU→공시가격) 조합으로 단지당 API
# 호출이 여러 번 걸린다.
#
# ⚠ 2026-07-18 확인: V-World(api.vworld.kr) 호출이 GitHub Actions의 클라우드 IP에서는
# 항상 502/연결끊김으로 실패한다(브라우저·가정용 네트워크에서는 동일 키·파라미터로
# 정상 응답 — key/domain 문제가 아니라 IP 차단으로 판단). data.go.kr에도 같은 데이터가
# 있지만 API 유형이 LINK라 실제로는 vworld.kr로 리다이렉트되는 카탈로그 항목일 뿐,
# 별도 채널이 아니어서 우회가 안 된다.
#
# 공동주택 공시가격은 애초에 연 1회(매년 1월 1일 기준, 보통 4~5월 발표)만 갱신되는
# 데이터라 자동화의 실익이 적다 — 그래서 매일 새벽 자동 스케줄은 빼고, 수동 실행만
# 남겨둔다. 정기 갱신은 사람이 연 1회 로컬 네트워크(IP 차단 없음)에서
# `TIME_BUDGET_MIN=0 python collect_official_price.py`로 전량 수집 후 결과를
# 커밋·푸시하는 방식을 권장한다(_meta/DATA_PIPELINE.md 참고). 이 워크플로는 필요할 때
# (예: V-World 쪽 차단이 풀렸는지 재확인) 수동으로만 돌린다.
on:
  workflow_dispatch:
    inputs:
      diag:
        description: "진단 모드 (V-World 응답 본문을 로그로 남기고 저장 생략)"
        type: boolean
        default: false
      limit:
        description: "처리할 단지 수 제한 (진단용, 0=제한 없음)"
        type: string
        default: "0"

permissions:
  contents: write

concurrency:
  group: refresh-official-price
  cancel-in-progress: false

jobs:
  official-price:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect official price (Kakao PNU 변환 + V-World 공시가격)
        working-directory: _meta
        timeout-minutes: 20
        env:
          TIME_BUDGET_MIN: "18"
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          VWORLD_KEY: ${{ secrets.VWORLD_KEY }}
          # lib_pdata.py VWORLD_KEYS 별칭 목록과 맞춤 — 시크릿을 어느 이름으로 등록했든 인식되게 함
          V_WORLD_KEY: ${{ secrets.V_WORLD_KEY }}
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
          VWORLD_KR_KEY: ${{ secrets.VWORLD_KR_KEY }}
          # V-World 인증키 발급 시 등록한 도메인 — 요청 domain 파라미터가 이와 일치해야
          # API가 응답한다(불일치/누락 시 502로 추정). 시크릿 미설정 시 사이트 실도메인 사용.
          VWORLD_DOMAIN: ${{ secrets.VWORLD_DOMAIN || 'topda.kr' }}
          OFFICIAL_PRICE_DIAG: ${{ inputs.diag && '1' || '' }}
          OFFICIAL_PRICE_LIMIT: ${{ inputs.limit || '0' }}
        run: python collect_official_price.py
        continue-on-error: true

      - name: Commit official_price.json
        run: bash _meta/git_commit_push.sh "공동주택 공시가격 자동 보강 ($(date -u +%Y-%m-%d))" site/assets/official_price.json
