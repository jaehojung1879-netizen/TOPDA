name: Refresh official price (공동주택 공시가격)

# 단지 공동주택가격(시가표준액)을 점진 보강 → site/assets/official_price.json.
#
# 2026-07-27 전환: V-World → 건축HUB 건축물대장 주택가격(getBrHsprcInfo).
#   이전 경로는 Kakao 키워드검색 → PNU 변환 → V-World 3단계였고 한 건도 못 모았다.
#   api.vworld.kr이 GitHub Actions 클라우드 IP를 막기 때문이다(2026-07-18 확인 — 같은
#   키·파라미터가 브라우저·가정용 네트워크에서는 정상 응답). data.go.kr의 같은 데이터는
#   API 유형이 LINK라 vworld.kr로 리다이렉트될 뿐이어서 우회가 안 됐다.
#   건축HUB는 apis.data.go.kr에 있어 IP 차단과 무관하고(다른 수집기가 매일 정상 호출),
#   조회키(시군구·법정동·본번·부번)는 실거래 원장이 주는 값이라 단지명을 대조하지 않는다.
#
# 공시가격은 연 1회(1월 1일 기준, 4~5월 발표) 갱신이라 이미 올해 기준일로 채운 단지는
# 건너뛴다. 다만 첫 전수 수집은 단지 수가 많아 여러 날에 걸린다 — 매일 돌리되 시간 예산
# 안에서 처리한 만큼만 저장하고 다음 실행이 이어받는다. 다 채우고 나면 대상이 0이라
# 사실상 아무 일도 하지 않는다.
on:
  schedule:
    - cron: "45 15 * * *"   # 매일 00:45 KST (listings 00:00 / news 00:10 / market 00:30 뒤)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-official-price
  cancel-in-progress: false

# 예산: 단지당 호출이 최대 60회에서 6회로 줄어(2026-08-01) 같은 시간에 훨씬 많이 채운다.
# 그래도 16,000개 단지라 며칠이 걸리므로, 다른 워크플로와 겹치지 않는 시간대인 만큼
# 예산을 18분 → 50분으로 늘려 초기 적재를 앞당긴다. 다 채우면 대상이 0이라 즉시 끝난다.
jobs:
  official-price:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect official price (건축HUB 건축물대장 주택가격)
        working-directory: _meta
        timeout-minutes: 55
        env:
          TIME_BUDGET_MIN: "50"
          # 건축HUB는 data.go.kr 계정 인증키를 쓴다 — '건축HUB 건축물대장정보 서비스'를
          # 같은 계정으로 활용신청·승인해야 한다(미승인 시 수집기가 권한 오류를 남기고 중단).
          DATA_GO_APT_PRICE: ${{ secrets.DATA_GO_APT_PRICE }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python collect_official_price.py
        continue-on-error: true

      # data/official_price_misses.json 도 함께 커밋한다 — 대장에 주택가격이 없거나 서버가
      # 계속 500을 뱉는 지번의 조회일 기록이다. 이게 푸시되지 않으면 다음 실행이 그 지번을
      # 처음부터 다시 부른다(2026-08-01 실행은 41건 시도 중 15건이 실패였다).
      - name: Commit official_price.json
        run: bash _meta/git_commit_push.sh "공동주택 공시가격 자동 보강 ($(date -u +%Y-%m-%d))" site/assets/official_price.json data/official_price_misses.json
