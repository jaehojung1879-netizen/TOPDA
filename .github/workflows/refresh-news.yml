name: Refresh real-estate news

# 섹터별 부동산 뉴스(홈 하단) + 이번 주 핵심 이슈(홈 상단)를 구글 뉴스 RSS로 집계 →
# site/assets/news.json. 키 불필요(공개 RSS). 매일 자정(KST)마다 갱신한다.
#   · 섹터별 뉴스: 매일 갱신
#   · 주간 요약/카드: 한 주간 헤드라인을 매일 다시 집계(주차 라벨은 매주 자동 변경)
# 수집 결과가 비면 collect_news.py가 기존 news.json을 보존한다(빈 화면 방지).
on:
  schedule:
    - cron: "10 15 * * *"   # 매일 00:10 KST (listings 00:00 / market 00:30 와 푸시 충돌 회피)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect news (Google News RSS)
        working-directory: _meta
        run: python collect_news.py

      # 커밋·푸시는 공용 스크립트 사용 — 동시 실행 워크플로와의 푸시 경합을 rebase+재시도로 흡수.
      #
      # ⚠ site/index.html 은 더 이상 커밋 대상이 아니다(2026-07-30). 홈의 기사 헤드라인 자동
      # 나열을 없애고, 운영자가 직접 쓴 '핵심 이슈'(_meta/home_issues.json →
      # build_home_issues.py)로 대체했다. index.html 에는 news:weekly:static 마커가 없으므로
      # collect_news.py 는 홈에 아무것도 쓰지 않으며, 여기서 index.html 을 커밋 목록에 넣으면
      # 사람이 편집한 홈이 자동 커밋에 휩쓸릴 수 있어 제외한다.
      - name: Commit news.json
        run: bash _meta/git_commit_push.sh "부동산 뉴스 자동 갱신 ($(date -u +%Y-%m-%d))" site/assets/news.json
