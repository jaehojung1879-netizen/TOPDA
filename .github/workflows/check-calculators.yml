name: Check calculator accuracy

# 계산기 정확성 회귀 테스트.
#
# 왜 CI 에서 도는가: 세율·대출규제·수수료는 rates.js 한 곳에 모여 있지만, 실제로 그 값을
# 읽어 쓰는 곳은 app.js 의 공통 엔진과 각 계산기 페이지로 흩어져 있다. 한쪽만 고치면
# 두 화면의 값이 조용히 갈리고, 그건 사람이 매번 눈으로 확인할 수 없다.
# 특히 대출 한도는 "과대 산출"이 사용자에게 직접 손해로 돌아가므로, 이전 규제값으로
# 계산한 값보다 커지지 않는지 기계가 막는다.
#
# 이 워크플로가 실패하면 배포를 막는 것이 아니라 PR 단계에서 알린다 — 배포
# (deploy-pages.yml)는 별개다.

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "site/assets/rates.js"
      - "site/assets/app.js"
      - "site/assets/bond_rate.json"
      - "site/calculators/**"
      - "site/en/calculators/**"
      - "scripts/check_*.mjs"
      - "_meta/collect_bond_rate.py"
      - ".github/workflows/check-calculators.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 각 스크립트는 의존성 없이 node:vm 으로 app.js·rates.js 를 그대로 로드한다.
      # npm install 이 필요 없으므로 설치 단계도 없다.
      - name: 세무 정확성 회귀 테스트
        run: node scripts/check_tax_rules.mjs

      - name: 대출 한도 회귀 테스트 (과대 산출 방지)
        run: node scripts/check_loan_limit_rules.mjs

      - name: 등기·법무사·국민주택채권 회귀 테스트
        run: node scripts/check_registration_cost.mjs

      - name: 양도소득세 parity 테스트
        run: node scripts/check_transfer_tax_parity.mjs

      - name: 종합계산기 parity 테스트
        run: node scripts/check_total_dashboard_parity.mjs
