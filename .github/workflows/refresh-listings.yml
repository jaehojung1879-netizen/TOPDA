name: Refresh listings (실거래·단지)

# 국토부 실거래가 + Kakao(좌표·역·학교) + K-apt(세대수·준공) 수집 →
# site/assets/transactions.json (실거래 조회) · apartments.json (맞춤찾기).
#
# 설계 원칙 (과거 장애에서 배운 것):
#  1) 산출물별로 수집→즉시 커밋을 분리한다. 뒤 스텝이 실패해도 앞 산출물은 반영된다.
#  2) 커밋·푸시는 _meta/git_commit_push.sh 로 통일한다. 다른 워크플로(뉴스·시세)가
#     동시에 main을 푸시하면 non-fast-forward로 거절되는데(2026-06-29~07-02 연속 실패),
#     스크립트가 rebase 후 재시도해 경합을 흡수한다.
#  3) 스텝 타임아웃 합계는 잡 타임아웃보다 작게 유지한다(과거: 합계 105분 > 잡 70분이라
#     마지막 단지 수집이 잡 타임아웃에 걸려 매일 취소됨).
#  4) 수집기는 TIME_BUDGET_MIN(분) 안에서 스스로 마무리·저장한다. 스텝 타임아웃으로
#     강제 종료되면 그 실행의 진행분이 통째로 유실되기 때문(2026-07-03 세대수 보강이
#     25분 내내 돌고 저장 못 한 사례).
on:
  schedule:
    - cron: "0 15 * * *"   # 매일 00:00 KST (자정마다 갱신)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-listings
  cancel-in-progress: false

jobs:
  listings:
    runs-on: ubuntu-latest
    timeout-minutes: 75    # 스텝 타임아웃 합계(20+17+10+20=67분) + 커밋·셋업 여유
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 1) 실거래 원장 (사용자 노출 핵심) — 먼저 수집하고 즉시 커밋. 80개 지역 ~16분.
      - name: Collect transactions (국토부 실거래 원장)
        working-directory: _meta
        timeout-minutes: 20
        env:
          DATA_GO_APT_PRICE: ${{ secrets.DATA_GO_APT_PRICE }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python collect_transactions.py
        continue-on-error: true

      - name: Commit transactions.json
        run: bash _meta/git_commit_push.sh "실거래 자동 갱신 ($(date -u +%Y-%m-%d))" site/assets/transactions.json

      # 2) 전세가율 (매매·전세 실거래 중위가) — 전세가율 지도용. 평소 ~9분.
      - name: Collect jeonse ratio (매매·전세 실거래 중위가)
        working-directory: _meta
        timeout-minutes: 17
        env:
          TIME_BUDGET_MIN: "15"
          DATA_GO_APT_PRICE: ${{ secrets.DATA_GO_APT_PRICE }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: python collect_jeonse_ratio.py
        continue-on-error: true

      - name: Commit jeonse_ratio.json
        run: bash _meta/git_commit_push.sh "전세가율 자동 갱신 ($(date -u +%Y-%m-%d))" site/assets/jeonse_ratio.json

      # 3) 단지 세대수 보강 (K-apt 전용, Kakao 미사용).
      # 수집기가 지역 단위로 중간 저장(checkpoint)하므로 예산이 모자라도 진행분은 남는다.
      - name: Enrich household counts (K-apt)
        working-directory: _meta
        timeout-minutes: 10
        env:
          TIME_BUDGET_MIN: "8"
          DATA_GO_APT_BASIC_INFO: ${{ secrets.DATA_GO_APT_BASIC_INFO }}
          DATA_GO_APT_PRICE: ${{ secrets.DATA_GO_APT_PRICE }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python collect_households.py
        continue-on-error: true

      - name: Commit household counts
        run: bash _meta/git_commit_push.sh "단지 세대수 자동 보강 ($(date -u +%Y-%m-%d))" site/assets/apartments.json

      # 4) 단지 집계 (Kakao 지오코딩 — 느림) — 예산이 줄면 보강을 먼저 멈추고,
      # 수집분을 병합·저장한 뒤 종료한다(merge가 기존 값을 보존하므로 점진 보강).
      - name: Collect apartments (국토부 실거래 + Kakao + K-apt)
        working-directory: _meta
        timeout-minutes: 20
        env:
          TIME_BUDGET_MIN: "18"
          DATA_GO_APT_PRICE: ${{ secrets.DATA_GO_APT_PRICE }}
          DATA_GO_APT_BASIC_INFO: ${{ secrets.DATA_GO_APT_BASIC_INFO }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: python collect_apartments.py
        continue-on-error: true

      - name: Commit apartments.json
        run: bash _meta/git_commit_push.sh "단지 정보 자동 갱신 ($(date -u +%Y-%m-%d))" site/assets/apartments.json
