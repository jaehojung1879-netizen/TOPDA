name: Refresh listings (실거래·단지)

# 국토부 실거래가 + Kakao(좌표·역·학교) + K-apt(세대수·준공) 수집 →
# site/assets/transactions.json (실거래 조회) · apartments.json (맞춤찾기).
#
# 설계 원칙 (과거 장애에서 배운 것):
#  1) 산출물별로 수집→즉시 커밋을 분리한다. 뒤 스텝이 실패해도 앞 산출물은 반영된다.
#  2) 커밋·푸시는 _meta/git_commit_push.sh 로 통일한다. 다른 워크플로(뉴스·시세)가
#     동시에 main을 푸시하면 non-fast-forward로 거절되는데(2026-06-29~07-02 연속 실패),
#     스크립트가 rebase 후 재시도해 경합을 흡수한다.
#  3) 스텝 타임아웃 합계는 잡 타임아웃보다 작게 유지한다(과거: 합계 105분 > 잡 70분이라
#     마지막 단지 수집이 잡 타임아웃에 걸려 매일 취소됨).
#  4) 수집기는 TIME_BUDGET_MIN(분) 안에서 스스로 마무리·저장한다. 스텝 타임아웃으로
#     강제 종료되면 그 실행의 진행분이 통째로 유실되기 때문(2026-07-03 세대수 보강이
#     25분 내내 돌고 저장 못 한 사례).
on:
  schedule:
    - cron: "0 15 * * *"   # 매일 00:00 KST (자정마다 갱신)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-listings
  cancel-in-progress: false

jobs:
  listings:
    runs-on: ubuntu-latest
    timeout-minutes: 150   # 스텝 타임아웃 합계 + 포털 보조조회(14분) + 커밋·셋업 여유
    # ⚠ 이 합계는 반드시 job timeout보다 작아야 한다(설계 원칙 3). 스텝을 늘릴 때 같이 올릴 것.
    # ※ 전월세 API 미승인 동안 전세가율 스텝은 선확인 후 수 초 만에 끝나므로 실제 소요는 훨씬 짧다.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 수집 시작 전에 main 최신으로 맞춘다.
      # workflow_dispatch는 '누른 시점'의 커밋을 체크아웃하는데, concurrency 대기열에
      # 걸리면 실제 실행은 수십 분 뒤다. 그 사이 스케줄 런이 main을 갱신하면 이 실행은
      # 낡은 원장 위에서 수집하게 되고, 마지막 push가 non-fast-forward로 거절된 뒤
      # 59MB 원장을 텍스트 병합하려다 충돌한다(2026-07-26 실행 #72가 이렇게 그날
      # 수집분을 통째로 잃었다). 최신 위에서 시작하면 이 경합 자체가 생기지 않는다.
      # (충돌이 그래도 나면 git_commit_push.sh가 생성물을 이번 실행 결과로 확정한다)
      - name: Sync to latest main
        if: github.ref_name == 'main'
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo "수집 기준 커밋: $(git rev-parse --short HEAD)"

      # 1) 실거래 원장 (사용자 노출 핵심) — 먼저 수집하고 즉시 커밋.
      # 수집 창이 6 → 12개월로 늘고 페이지네이션이 붙어 한 번에 다 못 받을 수 있다.
      # 수집기가 (지역, 월) 단위 증분 병합이라 예산 안에서 끊겨도 진행분이 보존되고
      # 다음 실행이 이어서 채운다. TIME_BUDGET_MIN이 스텝 타임아웃보다 먼저 걸리게 둔다.
      - name: Collect transactions (국토부 실거래 원장)
        working-directory: _meta
        timeout-minutes: 26
        env:
          TIME_BUDGET_MIN: "22"
          DATA_GO_APT_PRICE: ${{ secrets.DATA_GO_APT_PRICE }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python collect_transactions.py
        continue-on-error: true

      # complex_addr.json(단지별 지번·행정코드)도 함께 커밋한다. 이 파일이 푸시되지 않으면
      # ① 다음 실행이 빈 상태에서 시작해 그날 갱신한 (지역,월) 쌍의 단지만 남고 누적이 리셋되며
      # ② 공시가격 워크플로는 다른 러너라 파일 자체를 못 읽어 한 건도 못 부른다.
      - name: Commit transactions.json
        run: bash _meta/git_commit_push.sh "실거래 자동 갱신 ($(date -u +%Y-%m-%d))" site/assets/transactions.json site/assets/complex_addr.json

      # 1-b) 파인더 전용 사전집계본. 맞춤 내집 찾기는 거래 한 건씩이 아니라 단지별
      # 집계만 쓰는데, 원장을 통째로 받아 브라우저에서 매번 다시 집계하고 있었다.
      # 12개월 확장으로 원장이 59MB가 되면서 방문마다 60MB를 내려받게 됐다(로딩 지연의
      # 직접 원인). 집계를 여기서 미리 끝내 원장의 13% 크기로 내보낸다.
      - name: Build finder index (맞춤 내집 찾기 사전집계)
        working-directory: _meta
        timeout-minutes: 3
        run: python build_finder_index.py
        continue-on-error: true

      - name: Commit finder_index.json
        run: bash _meta/git_commit_push.sh "파인더 인덱스 갱신 ($(date -u +%Y-%m-%d))" site/assets/finder_index.json

      # 2) 전세가율 (매매·전세 실거래 중위가) — 전세가율 지도용. 평소 ~9분.
      - name: Collect jeonse ratio (매매·전세 실거래 중위가)
        working-directory: _meta
        timeout-minutes: 17
        env:
          TIME_BUDGET_MIN: "15"
          DATA_GO_APT_PRICE: ${{ secrets.DATA_GO_APT_PRICE }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: python collect_jeonse_ratio.py
        continue-on-error: true

      - name: Commit jeonse_ratio.json
        run: bash _meta/git_commit_push.sh "전세가율 자동 갱신 ($(date -u +%Y-%m-%d))" site/assets/jeonse_ratio.json

      # 3) 단지 세대수 보강 (K-apt 전용, Kakao 미사용).
      # 수집기가 지역 단위로 중간 저장(checkpoint)하므로 예산이 모자라도 진행분은 남는다.
      # 세대수 백필 가속: 신규 지역 확장으로 대상이 1,500개+ — 예산을 넉넉히 준다.
      - name: Enrich household counts (K-apt)
        working-directory: _meta
        timeout-minutes: 22
        env:
          TIME_BUDGET_MIN: "20"
          DATA_GO_APT_BASIC_INFO: ${{ secrets.DATA_GO_APT_BASIC_INFO }}
          DATA_GO_APT_PRICE: ${{ secrets.DATA_GO_APT_PRICE }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          # 실거래 전용 단지의 좌표·역·초등학교 점진 보강용(K-apt 주소 → 지오코딩)
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: python collect_households.py
        continue-on-error: true

      # data/households_coverage.json 도 함께 커밋한다 — 지역별 '대상 / K-apt목록 / 매칭'
      # 리포트다. 스텝 로그가 수천 줄이라 실행 후 tail로 닿지 않아, 미보강 원인을
      # (수록범위 한계인지 이름 표기 차이인지) 확인할 방법이 사실상 없었다.
      - name: Commit household counts
        run: bash _meta/git_commit_push.sh "단지 세대수 자동 보강 ($(date -u +%Y-%m-%d))" site/assets/apartments.json site/assets/households.json data/households_coverage.json

      # 3-b) 건축물대장으로 세대수·준공연도 보강 (K-apt가 못 덮는 몫).
      #
      # K-apt는 의무관리대상 공동주택만 수록해 전국 목록 11,546개 / 전체 단지 16,209개로
      # 수록률 71%가 천장이다. 실제로 위 K-apt 스텝은 회당 0~3건으로 포화됐고
      # (2026-07-27~29 누적 7,077 → 7,023), 더 돌려도 붙지 않는다. 건축물대장은
      # 의무관리대상 여부와 무관하게 모든 건축물이 등재되므로 그 천장이 없다.
      #
      # ⚠ 반드시 K-apt 스텝 뒤에 온다. 이 수집기는 세대수가 이미 있는 단지를 건너뛰므로
      #   (K-apt 값이 정본에 가깝다) 순서가 뒤바뀌면 K-apt가 채울 몫까지 대장이 먼저
      #   가져간다. 그리고 정적 페이지 생성(build_apt_pages·build_complex_pages)보다는
      #   앞에 둔다 — 단지 페이지가 '세대수 N세대'를 그날 바로 싣는다.
      #
      # 조회키는 complex_addr.json이 준다(collect_transactions.py 산출물). 단지명을 한 글자도
      # 대조하지 않으므로 K-apt 이름매칭의 표기 차이 문제가 없다.
      - name: Enrich from building ledger (건축물대장 세대수·준공연도)
        working-directory: _meta
        timeout-minutes: 20
        env:
          TIME_BUDGET_MIN: "18"
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          DATA_GO_APT_PRICE: ${{ secrets.DATA_GO_APT_PRICE }}
        run: python collect_building_ledger.py
        continue-on-error: true

      # data/ledger_misses.json 도 함께 커밋한다 — 대장에 없는 지번의 조회일 기록이다.
      # 이게 푸시되지 않으면 다음 실행이 대장 미등재 단지를 처음부터 다시 부르고,
      # 예산이 못 채울 단지에만 쓰인다.
      - name: Commit building ledger enrichment
        run: bash _meta/git_commit_push.sh "건축물대장 세대수 보강 ($(date -u +%Y-%m-%d))" site/assets/households.json data/ledger_misses.json

      # 4) 단지 집계 (Kakao 지오코딩 — 느림) — 예산이 줄면 보강을 먼저 멈추고,
      # 수집분을 병합·저장한 뒤 종료한다(merge가 기존 값을 보존하므로 점진 보강).
      - name: Collect apartments (국토부 실거래 + Kakao + K-apt)
        working-directory: _meta
        timeout-minutes: 20
        env:
          TIME_BUDGET_MIN: "18"
          DATA_GO_APT_PRICE: ${{ secrets.DATA_GO_APT_PRICE }}
          DATA_GO_APT_BASIC_INFO: ${{ secrets.DATA_GO_APT_BASIC_INFO }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: python collect_apartments.py
        continue-on-error: true

      - name: Commit apartments.json
        run: bash _meta/git_commit_push.sh "단지 정보 자동 갱신 ($(date -u +%Y-%m-%d))" site/assets/apartments.json

      # 4-b) 주소 기반 단지명·세대수 최종 보조조회.
      # K-apt/건축물대장보다 반드시 뒤에 둔다. 공공 원본이 비어 있는 단지만 Kakao 공식
      # Local·Web 검색 API로 조회하고, 정확 지번 또는 서로 다른 부동산 포털 2곳의 값이
      # 일치할 때만 반영한다. HTML 직접 스크래핑은 약관·차단·마크업 변경 위험 때문에 하지 않는다.
      # 동일 지번에 여러 단지가 있는 경우 이름 계열까지 일치하지 않으면 자동 합치지 않는다.
      - name: Enrich unresolved households from portal search
        working-directory: _meta
        timeout-minutes: 14
        env:
          TIME_BUDGET_MIN: "12"
          MAX_PORTAL_COMPLEXES: "150"
          MAX_PORTAL_NAMES: "150"
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: python collect_portal_households.py
        continue-on-error: true

      - name: Commit address identity and portal enrichment
        run: bash _meta/git_commit_push.sh "주소·포털 단지정보 보강 ($(date -u +%Y-%m-%d))" site/assets/apartments.json site/assets/households.json data/portal_household_candidates.json data/portal_household_misses.json

      # 5) 정적 페이지 생성 (SEO — 네이버·구글에 단지명이 정적 HTML로 노출).
      # 데이터 파일만 읽으므로 API 키 불필요, 수 초 내 종료.
      #
      # ⚠ 실행 순서 고정: build_apt_pages → build_complex_pages.
      #   · build_apt_pages 는 한글 지역 URL(/apt/*.html)과 /apt/ 색인의 sitemap 항목을,
      #     build_complex_pages 는 슬러그 URL(/apt/{slug}/…) 항목을 각각 재생성한다.
      #   · 한글 지역 페이지의 canonical을 슬러그 허브로 넘기는 판단은 build_apt_pages가
      #     data/slug-map.json(_meta.hubs)을 읽어 하므로, 허브를 만드는 쪽이 나중이면
      #     그날 새로 생긴 허브는 다음 실행에 반영된다(1일 지연, 색인상 무해).
      - name: Build static region pages (SEO)
        working-directory: _meta
        timeout-minutes: 4
        run: python build_apt_pages.py
        continue-on-error: true

      # 단지 페이지 — 기준 통과 전체(2026-07-26 기준 4,586개). 샘플 10개 단계는 끝났다.
      #
      # 여기서 생성하는 이유는 HTML을 커밋하기 위해서가 아니다(HTML은 .gitignore로 빠진다).
      # 이 실행이 남겨야 하는 건 두 가지다:
      #   · data/slug-map.json — 새로 등장한 단지의 슬러그를 발급·영속화한다. 이게 커밋돼야
      #     배포 때 다시 생성해도 같은 URL이 나온다(한 번 발급한 슬러그는 바꾸지 않는다).
      #   · sitemap — 생성 대상 URL 목록.
      # 실제 HTML은 deploy-pages.yml이 배포할 때마다 다시 만들어 올린다.
      - name: Build complex pages (슬러그·sitemap 갱신)
        working-directory: _meta
        timeout-minutes: 6
        run: python build_complex_pages.py --all
        continue-on-error: true

      # sitemap 분할 — 생성기들이 쓴 평면 목록(sitemap-all.xml)을 분류별 파일 +
      # sitemap index(sitemap.xml)로 변환한다. 반드시 모든 생성기 뒤에 온다.
      - name: Split sitemap into index
        working-directory: _meta
        timeout-minutes: 3
        run: python build_sitemaps.py
        continue-on-error: true

      - name: Commit region/complex pages
        run: bash _meta/git_commit_push.sh "단지·지역 페이지 자동 생성 ($(date -u +%Y-%m-%d))" site/apt site/sitemap.xml site/sitemap-all.xml site/sitemap-*.xml data/slug-map.json
