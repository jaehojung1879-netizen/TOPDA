name: Refresh market stats (R-ONE)

# 한국부동산원 R-ONE 지역 시세(매매·전세 가격지수·전세가율)만 수집 → site/assets/market.json.
# 가볍고 빠름. 국토부 실거래/Kakao 수집(refresh-listings)과 분리해 독립 실행한다.
on:
  schedule:
    - cron: "30 15 * * *"   # 매일 00:30 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-market
  cancel-in-progress: false

jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect market stats (R-ONE)
        working-directory: _meta
        env:
          R_ONE: ${{ secrets.R_ONE }}
          REB_RONE_KEY: ${{ secrets.REB_RONE_KEY }}
          # 전세가율 직접 통계표 ID(아파트 매매가격대비 전세가격비율). 설정 시 평균가격 역산 대신 사용.
          RONE_RATIO_STATBL_ID: ${{ vars.RONE_RATIO_STATBL_ID }}
        run: python collect_market.py

      - name: Commit market.json
        run: |
          git config user.name "topda-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain site/assets/market.json)" ]; then
            git add site/assets/market.json
            git commit -m "지역 시세 자동 갱신 ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "변경 없음 — 커밋 생략"
          fi

      # 상업용부동산(상가·오피스) 임대시세 — 분기 통계지만 매일 호출(미변경 시 커밋 생략).
      # RONE_COMM_TABLES(JSON: 유형→지표→STATBL_ID) 변수 미설정이면 수집기가 스킵하고 예시 보존.
      - name: Collect commercial rents (R-ONE 상업용 임대동향)
        working-directory: _meta
        env:
          R_ONE: ${{ secrets.R_ONE }}
          REB_RONE_KEY: ${{ secrets.REB_RONE_KEY }}
          RONE_COMM_TABLES: ${{ vars.RONE_COMM_TABLES }}
        run: python collect_commercial.py
        continue-on-error: true

      - name: Commit commercial.json
        run: |
          git config user.name "topda-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain site/assets/commercial.json)" ]; then
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git add site/assets/commercial.json
            git commit -m "상업용 임대시세 자동 갱신 ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "상업용 변경 없음 — 커밋 생략"
          fi
